name: Inline exercise type controls

on:
  push:
    branches: [exercise-url-presets]
    paths:
      - '.github/workflows/inline-exercise-type.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - run: python scripts/inline_exercise_type.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verbs.py nouns.py
          git commit -m "Align exercise type controls inline"
          git push origin exercise-url-presets

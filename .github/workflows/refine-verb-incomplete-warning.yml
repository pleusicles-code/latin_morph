name: Refine verb incomplete warning

on:
  push:
    branches: [exercise-url-presets]
    paths:
      - '.github/workflows/refine-verb-incomplete-warning.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - run: python scripts/refine_verb_incomplete_warning.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verbs.py
          git commit -m "Refine incomplete verb recognition warning"
          git push origin exercise-url-presets

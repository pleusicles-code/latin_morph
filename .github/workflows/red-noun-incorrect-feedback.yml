name: Red noun incorrect feedback

on:
  push:
    branches:
      - exercise-url-presets
    paths:
      - tools/red_noun_incorrect_feedback.py
      - .github/workflows/red-noun-incorrect-feedback.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tools/red_noun_incorrect_feedback.py
      - name: Syntax check
        run: python -m py_compile nouns.py
      - name: Verify incorrect feedback coloring
        run: |
          python - <<'PY'
          text = open('nouns.py').read()
          assert 'f":red-background[Correct: {all_possible_text}]"' in text
          assert 'f":green-background[Correct: {all_possible_text}]"' not in text
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nouns.py
          git commit -m "Use red background for incorrect noun feedback"
          git push

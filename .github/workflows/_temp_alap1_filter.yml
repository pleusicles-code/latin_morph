name: Temporary alap1 exercise filter

on:
  push:
    branches: [exercise-url-presets]
    paths:
      - '.github/workflows/_temp_alap1_filter.yml'

permissions:
  contents: write

jobs:
  apply-filter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - name: Apply alap1 filters
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise RuntimeError(f'Pattern not found in {path}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Shared helper in vocab.py
          replace_once(
              'vocab.py',
              'def _merge_repo_entries(vocab, additions, repo_name, preserve_core=None):\n',
              'def filter_vocab_by_repo(vocab, repo_name):\n'
              '    return {\n'
              '        key: value for key, value in vocab.items()\n'
              '        if repo_name in _repo_values(value.get("repo"))\n'
              '    }\n\n'
              'def _merge_repo_entries(vocab, additions, repo_name, preserve_core=None):\n'
          )

          replacements = {
              'nouns.py': [
                  ('from vocab import import_nouns\n', 'from vocab import import_nouns, filter_vocab_by_repo\n'),
                  ('noun_vocab = import_nouns()\n', 'noun_vocab = filter_vocab_by_repo(import_nouns(), "alap1")\n'),
              ],
              'adjectives.py': [
                  ('from vocab import import_adjectives\n', 'from vocab import import_adjectives, filter_vocab_by_repo\n'),
                  ('adj_vocab = import_adjectives()\n', 'adj_vocab = filter_vocab_by_repo(import_adjectives(), "alap1")\n'),
              ],
              'verbs.py': [
                  ('from vocab import import_verbs\n', 'from vocab import import_verbs, filter_vocab_by_repo\n'),
                  ('complete_verb_vocab = import_verbs()\n', 'complete_verb_vocab = filter_vocab_by_repo(import_verbs(), "alap1")\n'),
              ],
              'verbal_adj.py': [
                  ('from vocab import import_verbs\n', 'from vocab import import_verbs, filter_vocab_by_repo\n'),
                  ('complete_verb_vocab = import_verbs()\n', 'complete_verb_vocab = filter_vocab_by_repo(import_verbs(), "alap1")\n'),
              ],
              'recognize_declension.py': [
                  ('from vocab import import_nouns, import_adjectives\n', 'from vocab import import_nouns, import_adjectives, filter_vocab_by_repo\n'),
                  ('noun_vocab = import_nouns()\nadjective_vocab = import_adjectives()\n',
                   'noun_vocab = filter_vocab_by_repo(import_nouns(), "alap1")\nadjective_vocab = filter_vocab_by_repo(import_adjectives(), "alap1")\n'),
              ],
              'recognize_pos.py': [
                  ('from vocab import import_nouns, import_adjectives, import_verbs\n', 'from vocab import import_nouns, import_adjectives, import_verbs, filter_vocab_by_repo\n'),
                  ('noun_vocab = import_nouns()\nadjective_vocab = import_adjectives()\nverb_vocab = import_verbs()\n',
                   'noun_vocab = filter_vocab_by_repo(import_nouns(), "alap1")\nadjective_vocab = filter_vocab_by_repo(import_adjectives(), "alap1")\nverb_vocab = filter_vocab_by_repo(import_verbs(), "alap1")\n'),
              ],
              'identify_stems.py': [
                  ('from vocab import import_nouns, import_adjectives, import_verbs\n', 'from vocab import import_nouns, import_adjectives, import_verbs, filter_vocab_by_repo\n'),
                  ('noun_vocab = import_nouns()\nadjective_vocab = import_adjectives()\nverb_vocab = import_verbs()\n',
                   'noun_vocab = filter_vocab_by_repo(import_nouns(), "alap1")\nadjective_vocab = filter_vocab_by_repo(import_adjectives(), "alap1")\nverb_vocab = filter_vocab_by_repo(import_verbs(), "alap1")\n'),
              ],
          }

          for path, reps in replacements.items():
              for old, new in reps:
                  replace_once(path, old, new)

          # Static validation: all targeted files compile.
          import py_compile
          for path in ['vocab.py','nouns.py','adjectives.py','verbs.py','verbal_adj.py','recognize_declension.py','recognize_pos.py','identify_stems.py']:
              py_compile.compile(path, doraise=True)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vocab.py nouns.py adjectives.py verbs.py verbal_adj.py recognize_declension.py recognize_pos.py identify_stems.py
          git commit -m 'Temporarily restrict worked exercises to alap1 vocabulary'
          git push origin HEAD:exercise-url-presets

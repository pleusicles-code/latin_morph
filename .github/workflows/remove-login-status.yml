name: Remove login status message

on:
  push:
    branches:
      - exercise-url-presets
    paths:
      - tools/remove_login_status.py
      - .github/workflows/remove-login-status.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tools/remove_login_status.py
      - name: Syntax check
        run: python -m py_compile latin_morph.py
      - name: Diff check
        run: git diff --check
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latin_morph.py
          git commit -m "Remove login status diagnostic message"
          git push

name: Reduce global top padding to half rem

on:
  push:
    branches: [exercise-url-presets]
    paths:
      - '.github/workflows/reduce-global-top-padding-half-rem.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - run: python scripts/reduce_global_top_padding_half_rem.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          git commit -m "Reduce global page top padding to 0.5rem"
          git push origin exercise-url-presets

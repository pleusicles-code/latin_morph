name: Temporary fix pauper declension
on:
  push:
    branches: [exercise-url-presets]
    paths: ['.github/workflows/_temp_fix_pauper_decl.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - name: Patch and validate
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('vocab.py')
          s=p.read_text(encoding='utf-8')
          old='''    for word in ('dīves', 'pauper', 'vetus'):\n        adjective_vocab[word]['irreg'] = copy.deepcopy(alap3_adjectives[word]['irreg'])'''
          new='''    for word in ('dīves', 'pauper', 'vetus'):\n        adjective_vocab[word]['irreg'] = copy.deepcopy(alap3_adjectives[word]['irreg'])\n    # pauper is a one-ending 3rd-declension adjective; the legacy core entry\n    # incorrectly classified it with 1st/2nd-declension -er adjectives.\n    adjective_vocab['pauper']['decl'] = 3\n    adjective_vocab['pauper']['stem'] = 'pauper'\n    adjective_vocab['pauper']['noms'] = ('pauper',)'''
          if old not in s:
              raise SystemExit('alap3 irregular adjective block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          p=Path('inflection_tables.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('if decl == (1, 2) and adjective.endswith("er") and adjective != "pauper":', 'if decl == (1, 2) and adjective.endswith("er"):', 1)
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile vocab.py inflection_tables.py
          python - <<'PY'
          from pathlib import Path
          v=Path('vocab.py').read_text(encoding='utf-8')
          d=Path('inflection_tables.py').read_text(encoding='utf-8')
          assert "adjective_vocab['pauper']['decl'] = 3" in v
          assert "adjective_vocab['pauper']['noms'] = ('pauper',)" in v
          assert 'adjective != "pauper"' not in d
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vocab.py inflection_tables.py
          git commit -m 'Treat pauper as third-declension adjective'
          git push origin HEAD:exercise-url-presets

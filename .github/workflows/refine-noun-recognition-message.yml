name: Refine noun recognition message

on:
  push:
    branches:
      - exercise-url-presets
    paths:
      - tools/refine_noun_recognition_message.py
      - .github/workflows/refine-noun-recognition-message.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tools/refine_noun_recognition_message.py
      - name: Syntax check
        run: python -m py_compile nouns.py
      - name: Verify recognition wording
        run: |
          python - <<'PY'
          text = open('nouns.py').read()
          required = [
              'The dictionary entry is *{build_dictionary_entry(noun)}*',
              'matching_analyses = set()',
              'multiple correct answers are possible.',
              'multiple correct answers might be possible.',
              'Vowel lengths {vowel_phrase} indicated',
          ]
          for item in required:
              assert item in text, item
          assert 'Take into account that vowel lengths' not in text
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nouns.py
          git commit -m "Refine noun recognition guidance"
          git push

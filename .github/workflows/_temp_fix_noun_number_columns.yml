name: Temporary fix noun number columns
on:
  push:
    branches: [exercise-url-presets]
    paths: ['.github/workflows/_temp_fix_noun_number_columns.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - name: Patch and validate
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('inflection_tables.py')
          s=p.read_text(encoding='utf-8')
          old='''    table = {"sg.": [], "pl.": []}\n    for case in noun_cases:\n        table["sg."].append(join_form(noun_form(lemma, data, case, "sg")))\n        table["pl."].append(join_form(noun_form(lemma, data, case, "pl")))\n    st.table(pd.DataFrame(table, index=[CASE_LABELS[c] for c in noun_cases]))'''
          new='''    restriction = data.get("number")\n    numbers = [("sg", "sg."), ("pl", "pl.")]\n    if restriction == "singular":\n        numbers = [("sg", "sg.")]\n    elif restriction == "plural":\n        numbers = [("pl", "pl.")]\n    table = {label: [] for _, label in numbers}\n    for case in noun_cases:\n        for number, label in numbers:\n            table[label].append(join_form(noun_form(lemma, data, case, number)))\n    st.table(pd.DataFrame(table, index=[CASE_LABELS[c] for c in noun_cases]))'''
          if old not in s:
              raise SystemExit('target noun table block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python -m py_compile inflection_tables.py vocab.py nouns.py
          python - <<'PY'
          from pathlib import Path
          s=Path('inflection_tables.py').read_text(encoding='utf-8')
          assert 'restriction = data.get("number")' in s
          assert 'numbers = [("sg", "sg.")]' in s
          assert 'numbers = [("pl", "pl.")]' in s
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inflection_tables.py
          git commit -m 'Respect noun number restrictions in diagnostics'
          git push origin HEAD:exercise-url-presets

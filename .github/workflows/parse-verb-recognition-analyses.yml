name: Parse verb recognition analyses

on:
  push:
    branches: [exercise-url-presets]
    paths:
      - '.github/workflows/parse-verb-recognition-analyses.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - run: python scripts/parse_verb_recognition_analyses.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verbs.py
          git commit -m "Parse and canonicalize verb recognition analyses"
          git push origin exercise-url-presets

name: Trim verb tooltips

on:
  push:
    branches: [exercise-url-presets]
    paths:
      - '.github/workflows/trim-verb-tooltips.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - run: python scripts/trim_verb_tooltips.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verbs.py
          git commit -m "Simplify verb option tooltips"
          git push origin exercise-url-presets

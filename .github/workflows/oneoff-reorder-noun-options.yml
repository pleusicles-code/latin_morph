name: One-off reorder noun options

on:
  push:
    branches: [optional-supabase]

permissions:
  contents: write

jobs:
  reorder:
    if: github.event.head_commit.message == 'Run noun option reorder'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optional-supabase
      - name: Reorder noun display options
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('nouns.py')
          text = p.read_text()
          old = '''    show_declension = st.checkbox("Show declension?", \n                                  help="Select this box to show the noun's declension.", \n                                  value=defaults.get("show_declension") if defaults.get("show_declension") is not None else False)\n    show_stem = st.checkbox("Show noun stem/base?", \n                            help="Select this box to show the noun base. (The base is the stem without any of the trailing vowels that sometimes combine with endings.)",\n                            value=defaults.get("show_stem") if defaults.get("show_stem") is not None else False)\n    show_dictionary_entry = st.checkbox(\n        "Show dictionary entry?",\n        help="Select this box to show the whole dictionary entry of the noun, which allows one to reconstruct the stem/base from the genitive form.",\n        value=defaults.get("show_dictionary_entry") if defaults.get("show_dictionary_entry") is not None else False,\n    )\n'''
          new = '''    show_dictionary_entry = st.checkbox(\n        "Show dictionary entry?",\n        help="Select this box to show the whole dictionary entry of the noun, which allows one to reconstruct the stem/base from the genitive form.",\n        value=defaults.get("show_dictionary_entry") if defaults.get("show_dictionary_entry") is not None else False,\n    )\n    show_declension = st.checkbox("Show declension?", \n                                  help="Select this box to show the noun's declension.", \n                                  value=defaults.get("show_declension") if defaults.get("show_declension") is not None else False)\n    show_stem = st.checkbox("Show noun stem/base?", \n                            help="Select this box to show the noun base. (The base is the stem without any of the trailing vowels that sometimes combine with endings.)",\n                            value=defaults.get("show_stem") if defaults.get("show_stem") is not None else False)\n'''
          if old not in text:
              raise SystemExit('Expected options block not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Syntax check
        run: python -m py_compile nouns.py
      - name: Commit reorder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nouns.py
          git commit -m "Reorder noun display options"
          git push origin optional-supabase

name: Temporary mark fames singular only
on:
  push:
    branches: [exercise-url-presets]
    paths: ['.github/workflows/_temp_fames_singular.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - name: Patch and validate
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('vocab.py')
          s=p.read_text(encoding='utf-8')
          old="'famēs': {'meaning': 'éhség, éhínség, mohó vágy', 'gender': 'f', 'stem': 'fam', 'decl': 3},"
          new="'famēs': {'meaning': 'éhség, éhínség, mohó vágy', 'gender': 'f', 'stem': 'fam', 'decl': 3, 'number': 'singular'},"
          if old not in s:
              raise SystemExit('famēs entry not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python -m py_compile vocab.py nouns.py
          python - <<'PY'
          from pathlib import Path
          s=Path('vocab.py').read_text(encoding='utf-8')
          assert "'famēs': {'meaning': 'éhség, éhínség, mohó vágy', 'gender': 'f', 'stem': 'fam', 'decl': 3, 'number': 'singular'}" in s
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vocab.py
          git commit -m 'Mark fames singular only'
          git push origin HEAD:exercise-url-presets

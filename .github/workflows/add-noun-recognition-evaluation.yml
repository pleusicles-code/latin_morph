name: Add noun recognition evaluation

on:
  push:
    branches:
      - exercise-url-presets
    paths:
      - tools/add_noun_recognition_evaluation.py
      - .github/workflows/add-noun-recognition-evaluation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tools/add_noun_recognition_evaluation.py
      - name: Syntax check
        run: python -m py_compile nouns.py
      - name: Test noun recognition evaluation
        run: |
          python - <<'PY'
          import ast
          text = open('nouns.py').read()
          tree = ast.parse(text)
          wanted = {'canonicalize_noun_analyses', 'evaluate_noun_recognition_answer'}
          nodes = []
          for n in tree.body:
              if isinstance(n, ast.Assign) and any(isinstance(t, ast.Name) and t.id.startswith('NOUN_ANALYSIS_') for t in n.targets):
                  nodes.append(n)
              elif isinstance(n, ast.FunctionDef) and n.name in wanted:
                  nodes.append(n)
          ns = {}
          exec(compile(ast.Module(body=nodes, type_ignores=[]), '<eval>', 'exec'), ns)
          canon = ns['canonicalize_noun_analyses']
          evaluate = ns['evaluate_noun_recognition_answer']

          assert canon({('pl','dat'),('sg','abl'),('sg','nom'),('pl','nom'),('sg','voc')}) == [
              ('sg','nom'),('sg','voc'),('sg','abl'),('pl','nom'),('pl','dat')
          ]

          one = {('sg','gen')}
          assert evaluate({('sg','gen')}, one, False) == 'correct'
          assert evaluate({('sg','gen'),('sg','dat')}, one, False) == 'incorrect'
          assert evaluate({('sg','dat')}, one, True) == 'incorrect'

          many = {('sg','gen'),('sg','dat'),('pl','nom')}
          assert evaluate({('sg','gen')}, many, False) == 'correct'
          assert evaluate({('sg','gen'),('pl','nom')}, many, False) == 'correct'
          assert evaluate({('sg','gen'),('pl','acc')}, many, False) == 'partial'
          assert evaluate({('pl','acc')}, many, False) == 'incorrect'

          assert evaluate(many, many, True) == 'correct'
          assert evaluate({('sg','gen')}, many, True) == 'partial'
          assert evaluate(many | {('pl','acc')}, many, True) == 'partial'
          assert evaluate({('pl','acc')}, many, True) == 'incorrect'
          print('noun recognition evaluation tests passed')
          PY
      - name: Verify callback integration
        run: |
          python - <<'PY'
          text = open('nouns.py').read()
          required = [
              'evaluation = evaluate_noun_recognition_answer(',
              'canonicalize_noun_analyses(parsed_answer["analyses"])',
              'canonicalize_noun_analyses(matching_analyses)',
              '**Partially correct.**',
              'st.session_state.auto_advance_trigger = False',
          ]
          for item in required:
              assert item in text, item
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nouns.py
          git commit -m "Evaluate noun recognition answers"
          git push

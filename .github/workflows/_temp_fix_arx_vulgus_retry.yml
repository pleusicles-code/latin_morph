name: Temporary retry arx vulgus fix
on:
  push:
    branches: [exercise-url-presets]
    paths: ['.github/workflows/_temp_fix_arx_vulgus_retry.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
          fetch-depth: 0
      - name: Fix and validate
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile
          p=Path('vocab.py')
          text=p.read_text(encoding='utf-8')
          old_arx="'arx': {'decl': 3, 'gender': 'f', 'stem': 'arc', 'meaning': 'fellegvár, védőfal'}"
          new_arx="'arx': {'decl': '3_istem', 'gender': 'f', 'stem': 'arc', 'meaning': 'fellegvár, védőfal'}"
          old_vulgus="'vulgus': {'decl': '2_neut', 'gender': 'n', 'stem': 'vulg', 'meaning': 'tömeg, sokaság, köznép, csőcselék'}"
          new_vulgus="'vulgus': {'decl': '2_neut', 'gender': 'n', 'stem': 'vulg', 'meaning': 'tömeg, sokaság, köznép, csőcselék', 'irreg': {'sg': {'acc': 'vulgus'}}}"
          if old_arx in text: text=text.replace(old_arx,new_arx,1)
          if old_vulgus in text: text=text.replace(old_vulgus,new_vulgus,1)
          p.write_text(text,encoding='utf-8')
          py_compile.compile('vocab.py',doraise=True)
          PY
          python - <<'PY'
          import sys,types
          st=types.ModuleType('streamlit'); st.cache_data=lambda f:f; sys.modules['streamlit']=st
          import vocab
          n=vocab.filter_vocab_by_repo(vocab.import_nouns(),'alap2')
          assert n['arx']['decl']=='3_istem'
          assert n['arx']['stem']+'ium'=='arcium'
          assert n['vulgus']['irreg']['sg']['acc']=='vulgus'
          PY
          python -m py_compile vocab.py nouns.py inflection_tables.py
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vocab.py
          git diff --cached --quiet || git commit -m 'Fix arx and vulgus noun morphology'
          git pull --rebase origin exercise-url-presets
          git push origin HEAD:exercise-url-presets

name: Temporary reorder i-stem plural accusatives
on:
  push:
    branches: [exercise-url-presets]
    paths: ['.github/workflows/_temp_reverse_istem_acc.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - name: Reorder alternatives
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile
          p = Path('inflection_tables.py')
          text = p.read_text(encoding='utf-8')
          old = '"3_istem": {"sg":{"gen":"is","dat":"ī","acc":"em","abl":"e","voc":None},"pl":{"nom":"ēs","gen":"ium","dat":"ibus","acc":["īs","ēs"],"abl":"ibus","voc":None}}'
          new = '"3_istem": {"sg":{"gen":"is","dat":"ī","acc":"em","abl":"e","voc":None},"pl":{"nom":"ēs","gen":"ium","dat":"ibus","acc":["ēs","īs"],"abl":"ibus","voc":None}}'
          if old not in text:
              raise SystemExit('target i-stem ending definition not found')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          py_compile.compile('inflection_tables.py', doraise=True)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inflection_tables.py
          git commit -m 'Show -es before -is in i-stem plural accusatives'
          git push origin HEAD:exercise-url-presets

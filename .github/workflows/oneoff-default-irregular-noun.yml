name: One-off irregular noun default

on:
  push:
    branches: [optional-supabase]

permissions:
  contents: write

jobs:
  change-default:
    if: github.event.head_commit.message == 'Run irregular noun default change'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optional-supabase
      - name: Default irregular noun selection to deus only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('nouns.py')
          text = p.read_text()
          old = 'default=[noun for noun in defaults.get("irregs_include") if noun in irreg_nouns] if defaults.get("irregs_include") is not None else irreg_nouns,'
          new = 'default=[noun for noun in defaults.get("irregs_include") if noun in irreg_nouns] if defaults.get("irregs_include") is not None else (["deus"] if "deus" in irreg_nouns else []),'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one target, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Syntax check
        run: python -m py_compile nouns.py
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nouns.py
          git commit -m "Default irregular nouns to deus only"
          git push origin optional-supabase

name: Restore adaptive noun selection

on:
  push:
    branches:
      - exercise-url-presets
    paths:
      - tools/restore_adaptive_noun_selection.py
      - .github/workflows/restore-adaptive-noun-selection.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tools/restore_adaptive_noun_selection.py
      - name: Syntax check
        run: python -m py_compile nouns.py
      - name: Verify adaptive selector
        run: |
          python - <<'PY'
          text = open('nouns.py').read()
          assert 'noun, _, _ = adap_gen_question()' in text
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nouns.py
          git commit -m "Use adaptive noun selection in recognition mode"
          git push

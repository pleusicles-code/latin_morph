name: Translate verbs page v2

on:
  push:
    branches: [exercise-url-presets]
    paths:
      - '.github/workflows/translate-verbs-page-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - run: python scripts/translate_verbs_page.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verbs.py
          git commit -m "Translate and restyle verbs exercise"
          git push origin exercise-url-presets

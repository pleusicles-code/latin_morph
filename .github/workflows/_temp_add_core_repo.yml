name: Temporary core repo tag

on:
  push:
    branches: [exercise-url-presets]
    paths:
      - '.github/workflows/_temp_add_core_repo.yml'

permissions:
  contents: write

jobs:
  tag-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - name: Add repo metadata to top-level vocabulary entries
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast

          path = Path('vocab.py')
          text = path.read_text(encoding='utf-8')
          tree = ast.parse(text)
          lines = text.splitlines(keepends=True)

          targets = {'verb_vocab', 'noun_vocab', 'pronoun_vocab', 'adjective_vocab'}
          inserts = []

          for node in ast.walk(tree):
              if not isinstance(node, (ast.Assign, ast.AnnAssign)):
                  continue
              if isinstance(node, ast.Assign):
                  names = [t.id for t in node.targets if isinstance(t, ast.Name)]
                  value = node.value
              else:
                  names = [node.target.id] if isinstance(node.target, ast.Name) else []
                  value = node.value
              matched = next((n for n in names if n in targets), None)
              if not matched or not isinstance(value, ast.Dict):
                  continue

              for key, val in zip(value.keys, value.values):
                  if not isinstance(key, ast.Constant) or not isinstance(key.value, str) or not isinstance(val, ast.Dict):
                      continue
                  if any(isinstance(k, ast.Constant) and k.value == 'repo' for k in val.keys):
                      continue
                  line_i = val.lineno - 1
                  line = lines[line_i]
                  brace = line.find('{')
                  if brace < 0:
                      raise RuntimeError(f'Opening brace not found for {key.value!r}: {line!r}')
                  if line[brace+1:].strip():
                      payload = '"repo": "core", '
                  else:
                      indent = ' ' * (val.col_offset + 4)
                      payload = '\n' + indent + '"repo": "core",'
                  inserts.append((line_i, brace + 1, payload))

          for line_i, pos, payload in sorted(inserts, reverse=True):
              lines[line_i] = lines[line_i][:pos] + payload + lines[line_i][pos:]

          new = ''.join(lines)
          ast.parse(new)
          path.write_text(new, encoding='utf-8')

          # Verify semantically without importing Streamlit.
          tree2 = ast.parse(new)
          totals = {}
          missing = {}
          for node in ast.walk(tree2):
              if not isinstance(node, ast.Assign):
                  continue
              names = [t.id for t in node.targets if isinstance(t, ast.Name)]
              matched = next((n for n in names if n in targets), None)
              if not matched or not isinstance(node.value, ast.Dict):
                  continue
              total = 0
              miss = []
              for key, val in zip(node.value.keys, node.value.values):
                  if not isinstance(key, ast.Constant) or not isinstance(key.value, str) or not isinstance(val, ast.Dict):
                      continue
                  total += 1
                  repo_ok = any(
                      isinstance(k, ast.Constant) and k.value == 'repo'
                      and isinstance(v, ast.Constant) and v.value == 'core'
                      for k, v in zip(val.keys, val.values)
                  )
                  if not repo_ok:
                      miss.append(key.value)
              totals[matched] = total
              if miss:
                  missing[matched] = miss
          if missing:
              raise RuntimeError(f'Missing repo tags: {missing}')
          print('Tagged entries:', totals)
          PY
      - name: Commit vocab.py change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vocab.py
          git commit -m 'Tag core vocabulary entries with repo metadata'
          git push origin HEAD:exercise-url-presets

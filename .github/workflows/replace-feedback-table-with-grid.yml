name: Replace feedback table with CSS grid

on:
  push:
    branches: [exercise-url-presets]
    paths:
      - '.github/workflows/replace-feedback-table-with-grid.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - run: python scripts/replace_feedback_table_with_grid.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verbs.py
          git commit -m "Replace verb feedback table with CSS grid"
          git push origin exercise-url-presets

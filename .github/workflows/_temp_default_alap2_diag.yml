name: Temporary default alap2 diagnostic
on:
  push:
    branches: [exercise-url-presets]
    paths: ['.github/workflows/_temp_default_alap2_diag.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - name: Default diagnostic to alap2
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile
          p=Path('inflection_tables.py')
          text=p.read_text(encoding='utf-8')
          old='default_repo = "alap1" if "alap1" in available_repos else available_repos[0]'
          new='default_repo = "alap2" if "alap2" in available_repos else ("alap1" if "alap1" in available_repos else available_repos[0])'
          if old not in text:
              raise SystemExit('default repo line not found')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          py_compile.compile('inflection_tables.py',doraise=True)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inflection_tables.py
          git commit -m 'Default vocabulary diagnostic to alap2'
          git push origin HEAD:exercise-url-presets

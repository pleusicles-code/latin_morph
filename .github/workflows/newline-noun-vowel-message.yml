name: Newline noun vowel message

on:
  push:
    branches:
      - exercise-url-presets
    paths:
      - tools/newline_noun_vowel_message.py
      - .github/workflows/newline-noun-vowel-message.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tools/newline_noun_vowel_message.py
      - name: Syntax check
        run: python -m py_compile nouns.py
      - name: Verify newline
        run: |
          python - <<'PY'
          text = open('nouns.py').read()
          assert 'question += f"  \\nVowel lengths {vowel_phrase} indicated"' in text
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nouns.py
          git commit -m "Start noun vowel guidance on new line"
          git push

name: Temporary fix passive present 3pl diagnostics
on:
  push:
    branches: [exercise-url-presets]
    paths: ['.github/workflows/_temp_fix_passive_present_3pl.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - name: Patch and validate
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('inflection_tables.py')
          s=p.read_text(encoding='utf-8')
          old='''        if number == "sg" and person == 2 and conj in (3, "3io"):\n            return base + "eris"\n        return base + vowel + pass_end'''
          new='''        if number == "sg" and person == 2 and conj in (3, "3io"):\n            return base + "eris"\n        if number == "pl" and person == 3 and conj in (1, 2):\n            vowel = vowel.replace("ā", "a").replace("ē", "e")\n        return base + vowel + pass_end'''
          if old not in s:
              raise SystemExit('target passive-present block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python -m py_compile inflection_tables.py vocab.py verbs.py
          python - <<'PY'
          from pathlib import Path
          s=Path('inflection_tables.py').read_text(encoding='utf-8')
          assert 'if number == "pl" and person == 3 and conj in (1, 2):' in s
          assert 'vowel = vowel.replace("ā", "a").replace("ē", "e")' in s
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inflection_tables.py
          git commit -m 'Fix passive present third plurals in diagnostics'
          git push origin HEAD:exercise-url-presets

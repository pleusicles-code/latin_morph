name: Temporary fix pluperfect subjunctive passive diagnostic
on:
  push:
    branches: [exercise-url-presets]
    paths: ['.github/workflows/_temp_fix_plupf_subj_pass.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - name: Patch and validate
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('inflection_tables.py')
          s=p.read_text(encoding='utf-8')
          old='''def sum_form(tense, mood, number, person):\n    info = import_verbs()["sum"]\n    return irregular_verb_form(info, tense, "act", mood, number, person)'''
          new='''def sum_form(tense, mood, number, person):\n    info = import_verbs()["sum"]\n    stored = irregular_verb_form(info, tense, "act", mood, number, person)\n    if stored is not None:\n        return stored\n    # The vocabulary stores only some finite forms of sum.  Passive/deponent\n    # pluperfect subjunctives need the imperfect subjunctive of sum.\n    if tense == "impf" and mood == "subj":\n        forms = {\n            "sg": {1: "essem", 2: "essēs", 3: "esset"},\n            "pl": {1: "essēmus", 2: "essētis", 3: "essent"},\n        }\n        return forms[number][person]\n    return None'''
          if old not in s:
              raise SystemExit('sum_form block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python -m py_compile inflection_tables.py
          python - <<'PY'
          from pathlib import Path
          s=Path('inflection_tables.py').read_text(encoding='utf-8')
          for form in ('essem','essēs','esset','essēmus','essētis','essent'):
              assert form in s
          assert 'if tense == "impf" and mood == "subj"' in s
          assert 'aux_tense = "pres" if tense == "perf" else "impf"' in s
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inflection_tables.py
          git commit -m 'Fix passive pluperfect subjunctive diagnostics'
          git push origin HEAD:exercise-url-presets

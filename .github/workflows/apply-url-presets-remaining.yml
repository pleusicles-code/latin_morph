name: Apply remaining exercise URL presets

on:
  push:
    branches:
      - exercise-url-presets
    paths:
      - tools/apply_url_presets_remaining.py
      - .github/workflows/apply-url-presets-remaining.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tools/apply_url_presets_remaining.py
      - name: Syntax check
        run: python -m py_compile exercise_presets.py verbs.py adjectives.py verbal_adj.py pronouns.py
      - name: Diff check
        run: git diff --check
      - name: Commit patched files
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verbs.py adjectives.py verbal_adj.py pronouns.py
          git commit -m "Apply URL presets to remaining exercises"
          git push

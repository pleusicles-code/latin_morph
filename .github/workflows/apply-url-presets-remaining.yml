name: Validate exercise URL presets

on:
  push:
    branches:
      - exercise-url-presets
    paths:
      - exercise_presets.py
      - .github/workflows/apply-url-presets-remaining.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile exercise_presets.py nouns.py verbs.py adjectives.py verbal_adj.py pronouns.py
      - name: Diff whitespace check
        run: git diff --check optional-supabase...HEAD || git diff --check

name: Temporary audit vocab sources
on:
  push:
    branches: [exercise-url-presets]
    paths: ['.github/workflows/_temp_audit_vocab_sources.yml']
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - name: Inspect vocab imports and repos
        run: |
          python - <<'PY'
          import sys, types
          st = types.ModuleType('streamlit')
          st.cache_data = lambda f: f
          sys.modules['streamlit'] = st
          import vocab
          print('IMPORTS', [n for n in dir(vocab) if n.startswith('import_')])
          for name in [n for n in dir(vocab) if n.startswith('import_')]:
              fn = getattr(vocab, name)
              try:
                  data = fn()
              except TypeError:
                  continue
              if isinstance(data, dict):
                  repos = sorted({r for info in data.values() for r in ((info.get('repo') if isinstance(info.get('repo'), list) else [info.get('repo')]) if isinstance(info, dict) else []) if r})
                  print(name, 'count=', len(data), 'repos=', repos)
          PY

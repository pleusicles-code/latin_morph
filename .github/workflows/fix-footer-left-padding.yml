name: Fix footer and left padding

on:
  push:
    branches: [exercise-url-presets]
    paths:
      - '.github/workflows/fix-footer-left-padding.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - run: python scripts/fix_footer_and_left_padding.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py latin_morph.py
          git commit -m "Align footer with score and add left page padding"
          git push origin exercise-url-presets

name: Fix deferred answer clear

on:
  push:
    branches: [exercise-url-presets]
    paths:
      - '.github/workflows/fix-deferred-answer-clear.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - run: python scripts/fix_deferred_answer_clear.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add utils.py streamlit_app.py
          git commit -m "Defer answer input clearing until rerun"
          git push origin exercise-url-presets

name: One-off relabel irregular-only option

on:
  push:
    branches: [optional-supabase]

permissions:
  contents: write

jobs:
  relabel:
    if: github.event.head_commit.message == 'Run irregular-only relabel'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optional-supabase
      - name: Relabel irregular-only option
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('nouns.py')
          text = p.read_text()
          old = 'st.radio("Include *only* the selected irregular nouns?", '
          new = 'st.radio("Practice *only* the selected irregular nouns?", '
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one target, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Syntax check
        run: python -m py_compile nouns.py
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nouns.py
          git commit -m "Relabel irregular-only noun option"
          git push origin optional-supabase

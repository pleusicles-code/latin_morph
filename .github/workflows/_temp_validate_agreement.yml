name: Temporary validate agreement transform

on:
  push:
    branches:
      - exercise-url-presets

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile source files
        run: |
          python -m py_compile agreement_middle_patch.py agreement_impl.py agreement_stage.py agreement_loader.py agreement_base.py
      - name: Reconstruct and compile generated Agreement source
        run: |
          python - <<'PY'
          from pathlib import Path
          from itertools import permutations
          from agreement_middle_patch import apply_middle_mode, apply_recognition_mode
          from agreement_weight_patch import apply_pair_weighting

          # Load only the helper function definitions from agreement_loader.py.
          loader_text = Path("agreement_loader.py").read_text(encoding="utf-8")
          loader_prefix = loader_text.split("\nstage = Path(__file__)", 1)[0]
          ns = {"__file__": str(Path("agreement_loader.py").resolve())}
          exec(compile(loader_prefix, "agreement_loader_helpers.py", "exec"), ns)
          apply_multiple_answer_hint = ns["apply_multiple_answer_hint"]
          apply_weak_istem_is_ambiguity = ns["apply_weak_istem_is_ambiguity"]
          apply_colored_partial_feedback = ns["apply_colored_partial_feedback"]

          # Reproduce agreement_loader.py's transformation of agreement_stage.py,
          # but capture the transformed agreement_impl.py source instead of executing it.
          stage = Path("agreement_stage.py").read_text(encoding="utf-8")
          needle = 'exec(compile(source, str(Path(__file__).with_name("agreement_impl.py")), "exec"))'
          replacement = (
              'source = apply_middle_mode(source)\n'
              'source = apply_pair_weighting(source)\n'
              'source = apply_recognition_mode(source)\n'
              'source = apply_multiple_answer_hint(source)\n'
              'source = apply_weak_istem_is_ambiguity(source)\n'
              'source = apply_colored_partial_feedback(source)\n'
              'FINAL_IMPL_SOURCE = source\n'
          )
          if needle not in stage:
              raise RuntimeError("stage execution point missing")
          stage = stage.replace(needle, replacement, 1)

          stage_ns = {
              "__file__": str(Path("agreement_stage.py").resolve()),
              "Path": Path,
              "apply_middle_mode": apply_middle_mode,
              "apply_pair_weighting": apply_pair_weighting,
              "apply_recognition_mode": apply_recognition_mode,
              "apply_multiple_answer_hint": apply_multiple_answer_hint,
              "apply_weak_istem_is_ambiguity": apply_weak_istem_is_ambiguity,
              "apply_colored_partial_feedback": apply_colored_partial_feedback,
          }
          exec(compile(stage, "agreement_stage_generated.py", "exec"), stage_ns)
          impl = stage_ns["FINAL_IMPL_SOURCE"]
          compile(impl, "agreement_impl_generated.py", "exec")

          # Execute only the source-building implementation, replacing its final
          # agreement_base.py exec with a capture assignment.
          base_exec = 'exec(compile(source, str(Path(__file__).with_name("agreement_base.py")), "exec"))'
          if base_exec not in impl:
              raise RuntimeError("base execution point missing")
          impl = impl.replace(base_exec, "FINAL_BASE_SOURCE = source", 1)
          impl_ns = {"__file__": str(Path("agreement_impl.py").resolve())}
          exec(compile(impl, "agreement_impl_capture.py", "exec"), impl_ns)
          final_base = impl_ns["FINAL_BASE_SOURCE"]
          compile(final_base, "agreement_base_generated.py", "exec")
          print("generated Agreement source compiles successfully")
          PY

name: Temporary fix imperfect passive tables
on:
  push:
    branches: [exercise-url-presets]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - name: Fix imperfect passive generation
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile
          p = Path('inflection_tables.py')
          text = p.read_text(encoding='utf-8')
          old = '    if number == "sg" and person == 1:\n        return stem + bridge[:-1] + "or"\n    return stem + bridge + pass_end\n'
          new = '    if tense == "impf" and number == "sg" and person == 1:\n        return stem + bridge[:-1] + "ar"\n    if tense == "impf" and number == "pl" and person == 3:\n        return stem + bridge[:-1] + "antur"\n    if number == "sg" and person == 1:\n        return stem + bridge[:-1] + "or"\n    return stem + bridge + pass_end\n'
          if old not in text:
              raise SystemExit('target block not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          py_compile.compile('inflection_tables.py', doraise=True)
          PY
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add inflection_tables.py
          git commit -m 'Fix imperfect passive forms in inflection tables'
          git push origin HEAD:exercise-url-presets

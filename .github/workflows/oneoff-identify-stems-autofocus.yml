name: One-off Identify Stems autofocus

on:
  push:
    branches:
      - optional-supabase
    paths:
      - .identify-stems-autofocus-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optional-supabase
      - name: Patch and validate
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
          python -m py_compile identify_stems.py
          grep -n 'components.v1\|components.html' identify_stems.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add identify_stems.py
          git commit -m "Autofocus Identify Stems input"
          git push origin optional-supabase

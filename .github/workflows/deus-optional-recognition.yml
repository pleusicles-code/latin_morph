name: Deus optional recognition

on:
  push:
    branches:
      - exercise-url-presets
    paths:
      - tools/deus_optional_recognition.py
      - .github/workflows/deus-optional-recognition.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tools/deus_optional_recognition.py
      - name: Syntax check
        run: python -m py_compile nouns.py vocab.py
      - name: Verify deus recognition semantics
        run: |
          python - <<'PY'
          import ast

          nouns = open('nouns.py').read()
          vocab = open('vocab.py').read()

          assert '"deus": {"gender": "m"' in vocab
          deus_section = vocab.split('"deus": {', 1)[1].split('# 3rd declension', 1)[0]
          assert '"irreg": True' not in deus_section
          assert '"gen": ["deum", "deōrum"]' in deus_section
          assert 'def optional_noun_recognition_analyses' in nouns
          assert 'return {("pl", "gen")}' in nouns
          assert 'required_analyses = matching_analyses - optional_analyses' in nouns
          assert 'if len(required_analyses) > 1:' in nouns
          assert '("acc", "sg") in displayed_analyses' in nouns
          assert '"irregs_include": ["deus"]' not in nouns
          assert 'nouns_irregs_include = ["deus"]' not in nouns

          tree = ast.parse(nouns)
          node = next(n for n in tree.body if isinstance(n, ast.FunctionDef) and n.name == 'evaluate_noun_recognition_answer')
          ns = {}
          exec(compile(ast.Module(body=[node], type_ignores=[]), '<eval>', 'exec'), ns)
          evaluate = ns['evaluate_noun_recognition_answer']

          required = {('sg', 'acc')}
          optional = {('pl', 'gen')}
          assert evaluate({('sg', 'acc')}, required, optional) == 'correct'
          assert evaluate({('sg', 'acc'), ('pl', 'gen')}, required, optional) == 'correct'
          assert evaluate({('pl', 'gen')}, required, optional) == 'partial'
          assert evaluate({('sg', 'acc'), ('sg', 'dat')}, required, optional) == 'partial'
          assert evaluate({('sg', 'dat')}, required, optional) == 'incorrect'
          print('deus recognition tests passed')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nouns.py vocab.py
          git commit -m "Refine deus noun recognition"
          git push

name: Widen control rows and left align pages

on:
  push:
    branches: [exercise-url-presets]
    paths:
      - '.github/workflows/widen-control-rows-left-align.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - run: python scripts/widen_control_rows_left_align.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py *.py
          git commit -m "Widen exercise control buttons and left align pages"
          git push origin exercise-url-presets

name: Temporary diagnostic alap3 repo
on:
  push:
    branches: [exercise-url-presets]
    paths: ['.github/workflows/_temp_diag_alap3_repo.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - name: Patch and validate
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('inflection_tables.py')
          s=p.read_text(encoding='utf-8')
          old='''available_repos = sorted(\n    {repo for _, _, vocabulary in sources for data in vocabulary.values() for repo in repo_values(data)},\n    key=lambda repo: (repo != "core", sort_key(repo)),\n)'''
          new='''repo_order = {"core": 0, "alap1": 1, "alap2": 2, "alap3": 3}\navailable_repos = sorted(\n    {repo for _, _, vocabulary in sources for data in vocabulary.values() for repo in repo_values(data)},\n    key=lambda repo: (repo_order.get(repo, 100), sort_key(repo)),\n)'''
          if old not in s:
              raise SystemExit('available_repos block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python -m py_compile inflection_tables.py vocab.py
          python - <<'PY'
          import vocab
          def rv(d):
              v=d.get('repo')
              return list(v) if isinstance(v,(list,tuple,set)) else ([v] if v else [])
          repos=set()
          for fn in (vocab.import_nouns, vocab.import_adjectives, vocab.import_verbs):
              for d in fn().values(): repos.update(rv(d))
          if hasattr(vocab,'import_misc'):
              for d in vocab.import_misc().values(): repos.update(rv(d))
          assert 'alap3' in repos, repos
          print('repos:', sorted(repos))
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inflection_tables.py
          git commit -m 'Offer alap3 in diagnostic repo selector'
          git push origin HEAD:exercise-url-presets

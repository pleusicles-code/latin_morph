name: Temporary fix exercise repo filter imports
on:
  push:
    branches: [exercise-url-presets]
    paths: ['.github/workflows/_temp_fix_repo_filter_import.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - name: Patch and validate
        run: |
          python - <<'PY'
          from pathlib import Path
          targets = ['nouns.py','adjectives.py','verbs.py','verbal_adj.py','recognize_declension.py','recognize_pos.py','identify_stems.py']
          for name in targets:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              s=s.replace('filter_vocab_by_repos', 'filter_vocab_by_repo')
              # Replace calls of the form filter_vocab_by_repo(import_x(), ("alap1", "alap2"))
              import re
              s=re.sub(
                  r'filter_vocab_by_repo\((import_[A-Za-z_]+\(\)), \("alap1", "alap2"\)\)',
                  r'{**filter_vocab_by_repo(\1, "alap1"), **filter_vocab_by_repo(\1, "alap2")}',
                  s,
              )
              p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile vocab.py nouns.py adjectives.py verbs.py verbal_adj.py recognize_declension.py recognize_pos.py identify_stems.py
          python - <<'PY'
          from pathlib import Path
          targets=['nouns.py','adjectives.py','verbs.py','verbal_adj.py','recognize_declension.py','recognize_pos.py','identify_stems.py']
          for name in targets:
              s=Path(name).read_text(encoding='utf-8')
              assert 'filter_vocab_by_repos' not in s, name
              assert '"alap1"' in s and '"alap2"' in s, name
              assert 'filter_vocab_by_repo' in s, name
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nouns.py adjectives.py verbs.py verbal_adj.py recognize_declension.py recognize_pos.py identify_stems.py
          git commit -m 'Avoid new repo filter import in exercises'
          git push origin HEAD:exercise-url-presets

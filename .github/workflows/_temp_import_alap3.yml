name: Temporary import alap3 vocabulary
on:
  push:
    branches: [exercise-url-presets]
    paths: ['.github/workflows/_temp_import_alap3.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - name: Import reviewed alap3 vocabulary
        run: |
          python - <<'PY'
          import ast
          import copy
          import json
          import pprint
          from pathlib import Path

          vocab_path = Path('vocab.py')
          src = vocab_path.read_text(encoding='utf-8')
          if 'BEGIN ALAP3 NOUNS' in src or 'BEGIN ALAP3 ADJECTIVES' in src or 'BEGIN ALAP3 VERBS' in src:
              raise SystemExit('alap3 blocks already present')

          nouns = json.loads(Path('.github/_temp_alap3_nouns.json').read_text(encoding='utf-8'))
          adjectives = json.loads(Path('.github/_temp_alap3_adjectives.json').read_text(encoding='utf-8'))
          verbs = json.loads(Path('.github/_temp_alap3_verbs.json').read_text(encoding='utf-8'))
          misc = json.loads(Path('.github/_temp_alap3_misc.json').read_text(encoding='utf-8'))

          def adjective_tuples(value):
              if isinstance(value, list):
                  return tuple(adjective_tuples(item) for item in value)
              if isinstance(value, dict):
                  return {key: adjective_tuples(item) for key, item in value.items()}
              return value

          adjectives = adjective_tuples(adjectives)
          pf = lambda value: pprint.pformat(value, width=120, sort_dicts=False)

          noun_block = f'''    # BEGIN ALAP3 NOUNS\n    alap3_nouns = {pf(nouns)}\n    _merge_repo_entries(\n        noun_vocab,\n        alap3_nouns,\n        "alap3",\n        preserve_core={{'bōs', 'flōs', 'mēnsa', 'onus', 'sīdus'}},\n    )\n    # END ALAP3 NOUNS\n\n'''
          noun_marker = '    # END ALAP2 NOUNS\n'
          if noun_marker not in src:
              raise SystemExit('noun insertion marker missing')
          src = src.replace(noun_marker, noun_marker + '\n' + noun_block, 1)

          adjective_block = f'''    # BEGIN ALAP3 ADJECTIVES\n    alap3_adjectives = {pf(adjectives)}\n    _merge_repo_entries(\n        adjective_vocab,\n        alap3_adjectives,\n        "alap3",\n        preserve_core={{'miser', 'pauper', 'vetus'}},\n    )\n    # The reviewed alap3 list treats these as pedagogical irregulars:\n    # ordinary 3rd-declension adjectives otherwise follow the strong i-stem pattern.\n    for word in ('dīves', 'pauper', 'vetus'):\n        adjective_vocab[word]['irreg'] = copy.deepcopy(alap3_adjectives[word]['irreg'])\n    # END ALAP3 ADJECTIVES\n\n'''
          adjective_marker = '    # END ALAP2 ADJECTIVES\n'
          if adjective_marker not in src:
              raise SystemExit('adjective insertion marker missing')
          src = src.replace(adjective_marker, adjective_marker + '\n' + adjective_block, 1)

          verb_block = f'''    # BEGIN ALAP3 VERBS\n    alap3_verbs = {pf(verbs)}\n    _merge_repo_entries(\n        verb_vocab,\n        alap3_verbs,\n        "alap3",\n        preserve_core={{'audeō', 'cupiō', 'moneō', 'optō', 'parō', 'portō'}},\n    )\n    # END ALAP3 VERBS\n\n'''
          verb_marker = '    # END ALAP2 VERBS\n'
          if verb_marker not in src:
              raise SystemExit('verb insertion marker missing')
          src = src.replace(verb_marker, verb_marker + '\n' + verb_block, 1)

          misc_block = f'''    # BEGIN ALAP3 MISC\n    alap3_misc = {pf(misc)}\n    for data in alap3_misc.values():\n        data["repo"] = "alap3"\n    misc_vocab.update(alap3_misc)\n    # END ALAP3 MISC\n\n'''
          misc_marker = '    return misc_vocab\n'
          if misc_marker not in src:
              raise SystemExit('misc insertion marker missing')
          src = src.replace(misc_marker, misc_block + misc_marker, 1)
          vocab_path.write_text(src, encoding='utf-8')

          exercise_files = [
              'nouns.py', 'adjectives.py', 'verbs.py', 'verbal_adj.py',
              'recognize_declension.py', 'recognize_pos.py', 'identify_stems.py',
          ]
          import_names = ('import_nouns', 'import_adjectives', 'import_verbs')
          replacements = 0
          for filename in exercise_files:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              before = text
              for import_name in import_names:
                  old = f'**filter_vocab_by_repo({import_name}(), "alap2")'
                  new = old + f', **filter_vocab_by_repo({import_name}(), "alap3")'
                  text = text.replace(old, new)
              if text != before:
                  replacements += 1
                  path.write_text(text, encoding='utf-8')
          if replacements != 7:
              raise SystemExit(f'expected to update 7 exercise files, updated {replacements}')
          PY

          python -m py_compile vocab.py nouns.py adjectives.py verbs.py verbal_adj.py recognize_declension.py recognize_pos.py identify_stems.py

          python - <<'PY'
          import ast
          from pathlib import Path
          tree = ast.parse(Path('vocab.py').read_text(encoding='utf-8'))
          found = {}
          for node in ast.walk(tree):
              if isinstance(node, ast.Assign) and len(node.targets) == 1 and isinstance(node.targets[0], ast.Name):
                  name = node.targets[0].id
                  if name in {'alap3_nouns', 'alap3_adjectives', 'alap3_verbs', 'alap3_misc'}:
                      found[name] = ast.literal_eval(node.value)
          assert len(found['alap3_nouns']) == 71
          assert len(found['alap3_adjectives']) == 33
          assert len(found['alap3_verbs']) == 82
          assert len(found['alap3_misc']) == 6
          assert sum(data.get('no_pass') is True for data in found['alap3_verbs'].values()) == 20
          assert found['alap3_verbs']['appāreō']['no_pass'] is True
          assert found['alap3_verbs']['occidō']['lemma_lexical'] == 'occidō [leesik]'
          assert found['alap3_verbs']['occīdō']['lemma_lexical'] == 'occīdō [megöl]'
          assert found['alap3_nouns']['auris']['decl'] == '3_istem'
          assert found['alap3_nouns']['vātēs']['irreg']['pl']['gen'] == ['vātium', 'vātum']
          for word in ('dīves', 'pauper', 'vetus'):
              assert 'irreg' in found['alap3_adjectives'][word]
          assert set(found['alap3_misc']) == {'alō', 'decet', 'lavō', 'pereō', 'praesum', 'supersum'}
          for filename in ['nouns.py','adjectives.py','verbs.py','verbal_adj.py','recognize_declension.py','recognize_pos.py','identify_stems.py']:
              text = Path(filename).read_text(encoding='utf-8')
              assert '"alap3"' in text, filename
          print('alap3 validation passed')
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vocab.py nouns.py adjectives.py verbs.py verbal_adj.py recognize_declension.py recognize_pos.py identify_stems.py
          git commit -m 'Import reviewed alap3 vocabulary'
          git push origin HEAD:exercise-url-presets

name: One-off noun dictionary default

on:
  push:
    branches: [optional-supabase]

permissions:
  contents: write

jobs:
  change-default:
    if: github.event.head_commit.message == 'Run noun dictionary default change'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optional-supabase
      - name: Make dictionary entry checked by default
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('nouns.py')
          text = p.read_text()
          old = 'value=defaults.get("show_dictionary_entry") if defaults.get("show_dictionary_entry") is not None else False,'
          new = 'value=defaults.get("show_dictionary_entry") if defaults.get("show_dictionary_entry") is not None else True,'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one target, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Syntax check
        run: python -m py_compile nouns.py
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nouns.py
          git commit -m "Default noun dictionary entry option to on"
          git push origin optional-supabase

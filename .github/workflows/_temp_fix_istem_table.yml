name: Temporary fix i-stem noun tables
on:
  push:
    branches: [exercise-url-presets]
    paths: ['.github/workflows/_temp_fix_istem_table.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - name: Fix list-valued noun endings
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile
          p = Path('inflection_tables.py')
          text = p.read_text(encoding='utf-8')
          old = '    return stem + ending\n\nADJ_12 = {'
          new = '    if isinstance(ending, (list, tuple)):\n        return [stem + item for item in ending]\n    return stem + ending\n\nADJ_12 = {'
          if old not in text:
              raise SystemExit('noun return block not found')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          py_compile.compile('inflection_tables.py', doraise=True)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inflection_tables.py
          git commit -m 'Handle alternative endings in noun inflection tables'
          git push origin HEAD:exercise-url-presets

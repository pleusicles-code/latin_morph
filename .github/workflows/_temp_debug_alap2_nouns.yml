name: Temporary debug alap2 nouns
on:
  push:
    branches: [exercise-url-presets]
    paths: ['.github/workflows/_temp_debug_alap2_nouns.yml']
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - name: Patch and compare noun keys
        run: |
          sed -i 's/        adj_vocab,/        adjective_vocab,/' _temp_import_alap2.py
          python _temp_import_alap2.py
          python - <<'PY'
          import sys,types,unicodedata
          st=types.ModuleType('streamlit'); st.cache_data=lambda f:f; sys.modules['streamlit']=st
          import vocab
          expected=['aciēs','adventus','aetās','ager','agricola','amīcus','animal','arx','auxilium','caelum','clāmor','comes','custōdia','dea','exitium','fāma','fēmina','ferrum','fidēs','fōrma','fuga','furor','geminī','gēns','ignis','imperātor','īra','iter','iūdex','iūdicium','iūs','iussus','lacrima','latus','lēx','littera','lūx','magistrātus','maiōrēs','malum','manus','moenia','mōs','mulier','numerus','nūntius','oculus','odium','opera','poēta','potestās','praeda','proelium','prōvincia','rēgīna','regiō','religiō','repetītiō','Rōmulus','saeculum','scelus','scientia','sēdēs','sententia','servus','socius','speciēs','spēs','studium','taurus','tēlum','Tiberis','vēritās','victor','victōria','voluntās','vōx','vulgus']
          def key(s): return ''.join(c for c in unicodedata.normalize('NFD',s).casefold() if unicodedata.category(c)!='Mn')
          imported=vocab.filter_vocab_by_repo(vocab.import_nouns(),'alap2')
          ik={key(k):k for k in imported}
          for e in expected:
              if key(e) not in ik: print('MISSING',repr(e))
              elif ik[key(e)]!=e: print('RENAMED',repr(e),'->',repr(ik[key(e)]))
          seen={}
          for e in expected:
              k=key(e)
              if k in seen: print('EXPECTED COLLISION',repr(seen[k]),repr(e),k)
              seen[k]=e
          print('IMPORTED',len(imported))
          PY

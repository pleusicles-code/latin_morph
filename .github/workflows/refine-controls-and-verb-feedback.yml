name: Refine controls and verb feedback

on:
  push:
    branches: [exercise-url-presets]
    paths:
      - '.github/workflows/refine-controls-and-verb-feedback.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - run: python scripts/refine_controls_and_verb_feedback.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add utils.py identify_stems.py nouns.py recognize_declension.py recognize_pos.py verbs.py
          git commit -m "Refine answer clearing controls and verb feedback"
          git push origin exercise-url-presets

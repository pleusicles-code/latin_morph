name: Temporary apply active-only verb flags
on:
  push:
    branches: [exercise-url-presets]
    paths: ['.github/workflows/_temp_apply_active_only.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - name: Apply flags and validate
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('vocab.py')
          s=p.read_text(encoding='utf-8')
          old='''    # END ALAP2 VERBS\n\n    return verb_vocab\n'''
          new='''    # END ALAP2 VERBS\n\n    # Verbs for which BevLat deliberately suppresses ordinary passive practice.\n    # Impersonal/passive edge cases are outside the intended exercise scope.\n    active_only_verbs = {\n        "fugiō", "veniō",\n        "abeō", "cadō", "eō", "faciō", "intrō", "lateō", "maneō", "pugnō",\n        "respondeō", "stō", "triumphō", "vīvō",\n        "accēdō", "ārdeō", "cēdō", "concurrō", "conveniō", "currō", "ēveniō",\n        "placeō", "sapiō", "sedeō", "taceō", "valeō", "volō [repül]",\n    }\n    for verb in active_only_verbs:\n        if verb in verb_vocab:\n            verb_vocab[verb]["no_pass"] = True\n\n    return verb_vocab\n'''
          if old not in s:
              raise SystemExit('import_verbs return marker not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python -m py_compile vocab.py verbs.py inflection_tables.py
          python - <<'PY'
          import sys,types
          st=types.ModuleType('streamlit'); st.cache_data=lambda f:f; sys.modules['streamlit']=st
          import vocab
          v=vocab.import_verbs()
          expected={
              'fugiō','veniō','abeō','cadō','eō','faciō','intrō','lateō','maneō','pugnō','respondeō','stō','triumphō','vīvō',
              'accēdō','ārdeō','cēdō','concurrō','conveniō','currō','ēveniō','placeō','sapiō','sedeō','taceō','valeō','volō [repül]'
          }
          missing=[x for x in expected if x not in v]
          assert not missing, missing
          assert all(v[x].get('no_pass') is True for x in expected)
          assert not v['adeō'].get('no_pass')
          assert not v['trānseō'].get('no_pass')
          assert not v['vincō'].get('no_pass')
          PY
          python - <<'PY'
          from pathlib import Path
          verbs=Path('verbs.py').read_text(encoding='utf-8')
          diag=Path('inflection_tables.py').read_text(encoding='utf-8')
          assert '"pass" in voice_selector and "no_pass" not in data' in verbs
          assert 'elif not data.get("no_pass"):' in diag
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vocab.py
          git commit -m 'Mark selected verbs active only'
          git push origin HEAD:exercise-url-presets

name: Temporary apply active-only verb flags
on:
  push:
    branches: [exercise-url-presets]
    paths: ['.github/workflows/_temp_apply_active_only.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - name: Apply flags and validate
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('vocab.py')
          s=p.read_text(encoding='utf-8')
          targets = {
              'fugiō','veniō','abeō','cadō','eō','faciō','intrō','lateō','maneō','pugnō','respondeō','stō','triumphō','vīvō',
              'accēdō','ārdeō','cēdō','concurrō','conveniō','currō','ēveniō','placeō','sapiō','sedeō','taceō','valeō','volō [repül]'
          }
          import ast
          mod=ast.parse(s)
          class V(ast.NodeVisitor):
              def __init__(self): self.spans=[]
              def visit_FunctionDef(self,node):
                  if node.name=='import_verbs':
                      for n in ast.walk(node):
                          if isinstance(n,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='verb_vocab' for t in n.targets) and isinstance(n.value,ast.Dict):
                              for k,v in zip(n.value.keys,n.value.values):
                                  if isinstance(k,ast.Constant) and k.value in targets and isinstance(v,ast.Dict):
                                      self.spans.append((k.value,v.lineno,v.end_lineno))
          vis=V(); vis.visit(mod)
          found={name for name,_,_ in vis.spans}
          missing=targets-found
          if missing: raise SystemExit(f'missing initial verb entries: {sorted(missing)}')
          lines=s.splitlines()
          for name,start,end in sorted(vis.spans,key=lambda x:x[1], reverse=True):
              block='\n'.join(lines[start-1:end])
              if '"no_pass": True' in block or "'no_pass': True" in block:
                  continue
              # insert immediately after voice field when present
              inserted=False
              for i in range(start-1,end):
                  if '"voice":' in lines[i] or "'voice':" in lines[i]:
                      indent=lines[i][:len(lines[i])-len(lines[i].lstrip())]
                      lines.insert(i+1, indent+'"no_pass": True,')
                      inserted=True
                      break
              if not inserted:
                  raise SystemExit(f'no voice field for {name}')
          s='\n'.join(lines)+'\n'
          # compound/imported verbs may be built later; ensure final imported data carries flags for repo-specific entries too
          marker='''    return verb_vocab\n'''
          addition='''    active_only_verbs = {\n        "fugiō", "veniō", "abeō", "cadō", "eō", "faciō", "intrō", "lateō", "maneō",\n        "pugnō", "respondeō", "stō", "triumphō", "vīvō", "accēdō", "ārdeō", "cēdō",\n        "concurrō", "conveniō", "currō", "ēveniō", "placeō", "sapiō", "sedeō", "taceō",\n        "valeō", "volō [repül]",\n    }\n    for verb in active_only_verbs:\n        if verb in verb_vocab:\n            verb_vocab[verb]["no_pass"] = True\n\n    return verb_vocab\n'''
          if marker not in s: raise SystemExit('return marker missing')
          s=s.replace(marker,addition,1)
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile vocab.py verbs.py inflection_tables.py
          python - <<'PY'
          import sys,types
          st=types.ModuleType('streamlit'); st.cache_data=lambda f:f; sys.modules['streamlit']=st
          import vocab
          v=vocab.import_verbs()
          expected={
              'fugiō','veniō','abeō','cadō','eō','faciō','intrō','lateō','maneō','pugnō','respondeō','stō','triumphō','vīvō',
              'accēdō','ārdeō','cēdō','concurrō','conveniō','currō','ēveniō','placeō','sapiō','sedeō','taceō','valeō','volō [repül]'
          }
          assert all(v[x].get('no_pass') is True for x in expected)
          assert not v['adeō'].get('no_pass')
          assert not v['trānseō'].get('no_pass')
          assert not v['vincō'].get('no_pass')
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vocab.py
          git commit -m 'Mark selected verbs active only'
          git push origin HEAD:exercise-url-presets

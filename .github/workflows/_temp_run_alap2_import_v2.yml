name: Temporary import alap2 v2
on:
  push:
    branches: [exercise-url-presets]
    paths: ['.github/workflows/_temp_run_alap2_import_v2.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - name: Correct helper and run import
        run: |
          sed -i 's/        adj_vocab,/        adjective_vocab,/' _temp_import_alap2.py
          python _temp_import_alap2.py
      - name: Validate vocabulary
        run: |
          python - <<'PY'
          import sys, types
          st=types.ModuleType('streamlit'); st.cache_data=lambda f:f; sys.modules['streamlit']=st
          import vocab
          nouns=vocab.filter_vocab_by_repo(vocab.import_nouns(),'alap2')
          adjs=vocab.filter_vocab_by_repo(vocab.import_adjectives(),'alap2')
          verbs=vocab.filter_vocab_by_repo(vocab.import_verbs(),'alap2')
          misc=vocab.filter_vocab_by_repo(vocab.import_misc(),'alap2')
          print('COUNTS',len(nouns),len(adjs),len(verbs),len(misc))
          assert (len(nouns),len(adjs),len(verbs),len(misc))==(79,36,51,5)
          assert 'rēs pūblica' not in nouns and 'rēs pūblica' in misc
          assert 'senex' not in nouns and 'senex' in adjs
          for word in ['aiō','coepī','ōdī','oportet']:
              assert word not in verbs and word in misc
          assert verbs['fīō'].get('irreg',{}).get('irreg') is True
          assert 'volō [repül]' in verbs and verbs['volō [repül]']['conj']==1 and verbs['volō [repül]']['pres']=='vol'
          assert adjs['duo'].get('no_sg') is True
          assert adjs['trēs'].get('no_sg') is True
          assert adjs['ūnus'].get('no_pl') is True
          assert adjs['sōlus'].get('pronominal') is True
          assert adjs['tōtus'].get('pronominal') is True
          assert nouns['Tiberis']['irreg']['sg']=={'acc':'Tiberim','abl':'Tiberī'}
          assert misc['rēs pūblica']['lexical_only'] is True
          print('SPECIALS OK')
          PY
          python -m py_compile vocab.py inflection_tables.py
      - name: Commit import
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vocab.py inflection_tables.py
          git commit -m 'Import reviewed alap2 vocabulary'
          git push origin HEAD:exercise-url-presets

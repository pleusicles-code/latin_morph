name: One-off add recognition exercise navigation

on:
  push:
    branches: [optional-supabase]

permissions:
  contents: write

jobs:
  add:
    if: github.event.head_commit.message == 'Run recognition exercise navigation change'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optional-supabase
      - name: Add recognition page to navigation
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('latin_morph.py')
          text = p.read_text()

          replacements = {
              'faq_page = st.Page("faq.py", title="FAQ")\nnouns_page = st.Page("nouns.py", title="Nouns")':
                  'faq_page = st.Page("faq.py", title="FAQ")\nrecognize_pos_page = st.Page("recognize_pos.py", title="Recognize Part of Speech")\nnouns_page = st.Page("nouns.py", title="Nouns")',
              '                            "Parts of Speech": [\n                                nouns_page,':
                  '                            "Parts of Speech": [\n                                recognize_pos_page,\n                                nouns_page,',
              'menu_pos_row.markdown(":blue[**Practice**]")\nmenu_pos_row.page_link("nouns.py", label="Nouns")':
                  'menu_pos_row.markdown(":blue[**Practice**]")\nmenu_pos_row.page_link("recognize_pos.py", label="Recognize Part of Speech")\nmenu_pos_row.page_link("nouns.py", label="Nouns")',
          }

          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one target, found {text.count(old)} for {old!r}')
              text = text.replace(old, new, 1)

          p.write_text(text)
          PY
      - name: Syntax check
        run: python -m py_compile latin_morph.py recognize_pos.py
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latin_morph.py recognize_pos.py
          git commit -m "Add part-of-speech recognition exercise to navigation"
          git push origin optional-supabase

name: Patch verb recognition macrons

on:
  push:
    branches: [exercise-url-presets]
    paths:
      - '.github/workflows/patch-verb-recognition-macrons.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - run: python scripts/patch_verb_recognition_macrons.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verbs.py
          git commit -m "Add macron option to verb recognition"
          git push origin exercise-url-presets

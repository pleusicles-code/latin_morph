name: Add noun recognition prompt

on:
  push:
    branches:
      - exercise-url-presets
    paths:
      - tools/add_noun_recognition_prompt.py
      - .github/workflows/add-noun-recognition-prompt.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tools/add_noun_recognition_prompt.py
      - name: Syntax check
        run: python -m py_compile nouns.py
      - name: Verify recognition prompt hooks
        run: |
          python - <<'PY'
          text = open('nouns.py').read()
          required = [
              'Which number and case can *{displayed_form}* represent?',
              'The dictionary entry is *{build_dictionary_entry(noun)}*.',
              'Take into account that vowel lengths {vowel_phrase} indicated',
              'multiple correct answers {multiple_phrase} possible.',
              'st.session_state.correct_answer = st.session_state.answer_input',
              'on_click=submit_noun_answer',
          ]
          for item in required:
              assert item in text, item
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nouns.py
          git commit -m "Add noun recognition prompt flow"
          git push

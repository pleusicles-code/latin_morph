name: Widen controls and right align score

on:
  push:
    branches: [exercise-url-presets]
    paths:
      - '.github/workflows/widen-controls-right-align-score.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - run: python scripts/widen_controls_right_align_score.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nouns.py verbs.py identify_stems.py recognize_declension.py recognize_pos.py
          git commit -m "Widen control buttons and right align score"
          git push origin exercise-url-presets

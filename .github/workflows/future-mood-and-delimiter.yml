name: Future mood inference and analysis delimiter

on:
  push:
    branches: [exercise-url-presets]
    paths:
      - '.github/workflows/future-mood-and-delimiter.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - run: python scripts/future_mood_and_delimiter.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verbs.py
          git commit -m "Infer future indicative across multiple analyses"
          git push origin exercise-url-presets

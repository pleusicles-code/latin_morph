name: Temporary align recognize declension score panel
on:
  push:
    branches: [exercise-url-presets]
    paths: ['.github/workflows/_temp_align_recognize_declension_score.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - name: Patch and validate
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('recognize_declension.py')
          s=p.read_text(encoding='utf-8')
          s2=re.sub(
              r'\n\ndef score_bar_color\(percent\):.*?\n\nst\.session_state\.gen_func = gen_question',
              '\n\nst.session_state.gen_func = gen_question',
              s,
              count=1,
              flags=re.S,
          )
          if s2 == s:
              raise SystemExit('custom score helper block not found')
          s=s2
          old='''    with score_col:\n        score_display_col, restart_col = st.columns([2, 1], gap="small", vertical_alignment="top")\n        with score_display_col:\n            render_score_panel()\n        with restart_col:\n            st.button(\n                "Újrakezdés",\n                "recognize_declension_reset",\n                on_click=reset_recognition_score,\n                width="stretch",\n            )\n'''
          new='''    with score_col:\n        st.button(\n            "Pontszám nullázása",\n            "recognize_declension_reset",\n            on_click=reset_recognition_score,\n            width="stretch",\n        )\n        st.markdown(\n            f'<div style="text-align:right;">Jelenlegi pontszám: <strong>{st.session_state.current_score}</strong> / <strong>{st.session_state.total_questions}</strong></div>',\n            unsafe_allow_html=True,\n        )\n'''
          if old not in s:
              raise SystemExit('custom score column block not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile recognize_declension.py streamlit_app.py
          python - <<'PY'
          from pathlib import Path
          s=Path('recognize_declension.py').read_text(encoding='utf-8')
          app=Path('streamlit_app.py').read_text(encoding='utf-8')
          assert 'def render_score_panel' not in s
          assert 'def score_bar_color' not in s
          assert '"Pontszám nullázása"' in s
          assert 'Jelenlegi pontszám:' in s
          assert 'label != "Pontszám nullázása"' in app
          assert 'background:rgba(128,128,128,0.055)' in app
          assert 'height:6px;background:rgba(128,128,128,0.18)' in app
          assert 'transform:translateY(-7px)' in app
          assert 'if total_questions >= 6:' in app
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recognize_declension.py
          git commit -m 'Use shared score panel in recognize declension'
          git push origin HEAD:exercise-url-presets

name: Remove verb option separator

on:
  push:
    branches: [exercise-url-presets]
    paths:
      - '.github/workflows/remove-verb-option-separator.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - run: python scripts/remove_verb_option_separator.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verbs.py
          git commit -m "Remove separator from verb options"
          git push origin exercise-url-presets
# trigger

name: Color verb recognition feedback parameters

on:
  push:
    branches: [exercise-url-presets]
    paths:
      - '.github/workflows/color-verb-feedback-parameters.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - run: python scripts/color_verb_feedback_parameters.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verbs.py
          git commit -m "Color supplied verb recognition parameters"
          git push origin exercise-url-presets

name: One-off Identify Stems UI fixes

on:
  push:
    branches: [optional-supabase]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run Identify Stems UI fixes 3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optional-supabase
      - name: Patch identify_stems.py
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Syntax check
        run: python -m py_compile identify_stems.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add identify_stems.py
          git commit -m "Refine Identify Stems answer UI"
          git push origin optional-supabase

name: Set global width 1300

on:
  push:
    branches: [exercise-url-presets]
    paths:
      - '.github/workflows/set-global-width-1300.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - run: python scripts/set_global_width_1300.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          git commit -m "Set global page width to 1300px"
          git push origin exercise-url-presets

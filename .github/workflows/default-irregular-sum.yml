name: Default irregular verb to sum

on:
  push:
    branches: [exercise-url-presets]
    paths:
      - '.github/workflows/default-irregular-sum.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - run: python scripts/default_irregular_sum.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verbs.py
          git commit -m "Default irregular verb selection to sum"
          git push origin exercise-url-presets

name: Hold noun parse errors

on:
  push:
    branches:
      - exercise-url-presets
    paths:
      - tools/hold_noun_parse_errors.py
      - .github/workflows/hold-noun-parse-errors.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tools/hold_noun_parse_errors.py
      - name: Syntax check
        run: python -m py_compile nouns.py
      - name: Verify parse-error hold behavior
        run: |
          python - <<'PY'
          text = open('nouns.py').read()
          required = [
              'st.session_state.answer_checked = False',
              'st.session_state.button_disable = False',
              'st.session_state.total_questions = max(0, st.session_state.total_questions - 1)',
              'Please check your answer and try again.',
          ]
          for item in required:
              assert item in text, item
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nouns.py
          git commit -m "Keep noun question active after parse errors"
          git push

name: Fix verb defaults and clear input

on:
  push:
    branches: [exercise-url-presets]
    paths:
      - '.github/workflows/fix-verb-defaults-and-clear-input.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - run: python scripts/fix_verb_defaults_and_clear_input.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verbs.py
          git commit -m "Default verb dictionary entry on and clear recognized answers"
          git push origin exercise-url-presets

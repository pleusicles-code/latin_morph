name: Temporary final arx vulgus fix
on:
  push:
    branches: [exercise-url-presets]
    paths: ['.github/workflows/_temp_fix_arx_vulgus_final.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - name: Patch and validate
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('vocab.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace("'arx': {'decl': 3, 'gender': 'f', 'stem': 'arc', 'meaning': 'fellegvár, védőfal'}", "'arx': {'decl': '3_istem', 'gender': 'f', 'stem': 'arc', 'meaning': 'fellegvár, védőfal'}", 1)
          s=s.replace("'vulgus': {'decl': '2_neut', 'gender': 'n', 'stem': 'vulg', 'meaning': 'tömeg, sokaság, köznép, csőcselék'}", "'vulgus': {'decl': '2_neut', 'gender': 'n', 'stem': 'vulg', 'meaning': 'tömeg, sokaság, köznép, csőcselék', 'number': 'singular', 'irreg': {'sg': {'acc': 'vulgus', 'voc': None}}}", 1)
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile vocab.py nouns.py inflection_tables.py
          python - <<'PY'
          import sys,types
          st=types.ModuleType('streamlit'); st.cache_data=lambda f:f; sys.modules['streamlit']=st
          import vocab
          n=vocab.filter_vocab_by_repo(vocab.import_nouns(),'alap2')
          assert n['arx']['decl']=='3_istem'
          assert n['arx']['stem']+'ium'=='arcium'
          assert n['vulgus']['number']=='singular'
          assert n['vulgus']['irreg']['sg']['acc']=='vulgus'
          assert n['vulgus']['irreg']['sg']['voc'] is None
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vocab.py
          git commit -m 'Fix arx and restrict vulgus morphology'
          git push origin HEAD:exercise-url-presets

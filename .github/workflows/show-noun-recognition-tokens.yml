name: Show noun recognition tokens

on:
  push:
    branches:
      - exercise-url-presets
    paths:
      - tools/show_noun_recognition_tokens.py
      - .github/workflows/show-noun-recognition-tokens.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tools/show_noun_recognition_tokens.py
      - name: Syntax check
        run: python -m py_compile nouns.py
      - name: Verify token feedback
        run: |
          python - <<'PY'
          text = open('nouns.py').read()
          assert 'tokenize_morphology_answer' in text
          assert 'Your answer is correct: {tokens}' in text
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nouns.py
          git commit -m "Show tokenized noun recognition answers"
          git push

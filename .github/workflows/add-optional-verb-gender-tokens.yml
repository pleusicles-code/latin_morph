name: Add optional verb gender tokens

on:
  push:
    branches: [exercise-url-presets]
    paths:
      - '.github/workflows/add-optional-verb-gender-tokens.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - run: python scripts/add_optional_verb_gender_tokens.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verbs.py
          git commit -m "Add optional gender tokens for participial verb forms"
          git push origin exercise-url-presets

name: Temporary fix future passive pl3
on:
  push:
    branches: [exercise-url-presets]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - name: Patch future passive plural third
        run: |
          python -c "from pathlib import Path; import py_compile; p=Path('inflection_tables.py'); s=p.read_text(encoding='utf-8'); old='    if tense == \"fut\" and number == \"sg\" and person == 1:\n        if conj == 3:\n            return stem + \"ar\"\n        if conj in (\"3io\", 4):\n            return stem + \"iar\"\n'; new=old+'    if tense == \"fut\" and number == \"pl\" and person == 3:\n        if conj == 3:\n            return stem + \"entur\"\n        if conj in (\"3io\", 4):\n            return stem + \"ientur\"\n'; assert old in s; p.write_text(s.replace(old,new,1),encoding='utf-8'); py_compile.compile('inflection_tables.py',doraise=True)"
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inflection_tables.py
          git commit -m 'Fix future passive plural third forms in diagnostic tables'
          git push origin HEAD:exercise-url-presets

name: Verb recognition feedback grid

on:
  push:
    branches: [exercise-url-presets]
    paths:
      - '.github/workflows/verb-feedback-grid.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - run: python scripts/verb_feedback_grid.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verbs.py
          git commit -m "Use aligned grid for incorrect verb recognition feedback"
          git push origin exercise-url-presets

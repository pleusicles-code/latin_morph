name: One-off filter recognition vocabulary

on:
  push:
    branches: [optional-supabase]

permissions:
  contents: write

jobs:
  filter:
    if: github.event.head_commit.message == 'Run recognition vocabulary filter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optional-supabase
      - name: Filter recognition vocabulary
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('recognize_pos.py')
          text = p.read_text()

          old = '''VOCABULARIES = {
    "noun": noun_vocab,
    "adjective": adjective_vocab,
    "verb": verb_vocab,
}
'''

          new = '''def noun_has_beginner_dictionary_entry(data):
    # Exclude nouns whose singular genitive is explicitly unavailable
    # (e.g. vīs), since this exercise teaches the standard dictionary-entry pattern.
    return data.get("irreg", {}).get("sg", {}).get("gen", "__regular__") is not None


def verb_has_beginner_dictionary_entry(data):
    # Exclude genuinely irregular verbs such as sum, possum, ferō, etc.
    # Verbs with only isolated irregular forms (e.g. dīcō, dūcō) remain eligible.
    return data.get("irreg", {}).get("irreg") is not True


VOCABULARIES = {
    "noun": {word: data for word, data in noun_vocab.items() if noun_has_beginner_dictionary_entry(data)},
    "adjective": adjective_vocab,
    "verb": {word: data for word, data in verb_vocab.items() if verb_has_beginner_dictionary_entry(data)},
}
'''

          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one VOCABULARIES block, found {text.count(old)}')
          text = text.replace(old, new, 1)
          p.write_text(text)
          PY
      - name: Syntax check
        run: python -m py_compile recognize_pos.py
      - name: Sanity-check filter rules
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('recognize_pos.py').read_text()
          assert 'get("gen", "__regular__") is not None' in text
          assert 'get("irreg", {}).get("irreg") is not True' in text
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recognize_pos.py
          git commit -m "Limit recognition exercise to beginner dictionary entries"
          git push origin optional-supabase

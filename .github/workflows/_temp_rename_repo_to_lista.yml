name: Temporary rename Repo to Lista
on:
  push:
    branches: [exercise-url-presets]
    paths: ['.github/workflows/_temp_rename_repo_to_lista.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - name: Patch and validate
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('inflection_tables.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Repó:', 'Lista:')
          s=s.replace('**Repó:**', '**Lista:**')
          s=s.replace('repóadat', 'listaadat')
          s=s.replace('repó- és szófaj-kombinációban', 'lista- és szófaj-kombinációban')
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile inflection_tables.py
          python - <<'PY'
          from pathlib import Path
          s=Path('inflection_tables.py').read_text(encoding='utf-8')
          assert 'Repó' not in s
          assert 'repó' not in s
          assert 'Lista:' in s
          assert '**Lista:**' in s
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inflection_tables.py
          git commit -m 'Rename repository labels to Lista in diagnostics'
          git push origin HEAD:exercise-url-presets

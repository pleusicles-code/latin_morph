name: Add morphology tokenizer

on:
  push:
    branches:
      - exercise-url-presets
    paths:
      - tools/add_morphology_tokenizer.py
      - .github/workflows/add-morphology-tokenizer.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tools/add_morphology_tokenizer.py
      - name: Syntax check
        run: python -m py_compile utils.py
      - name: Test tokenizer
        run: |
          python - <<'PY'
          import ast
          import re

          source = open('utils.py').read()
          tree = ast.parse(source)
          function = next(
              node for node in tree.body
              if isinstance(node, ast.FunctionDef) and node.name == 'tokenize_morphology_answer'
          )
          module = ast.Module(body=[function], type_ignores=[])
          namespace = {'re': re}
          exec(compile(module, 'utils.py', 'exec'), namespace)
          tokenize_morphology_answer = namespace['tokenize_morphology_answer']

          cases = {
              'sg.gen./dat': ['sg', 'gen', 'dat'],
              'sg.gen, dat': ['sg', 'gen', 'dat'],
              'SG. GEN. / DAT.': ['sg', 'gen', 'dat'],
              'sg. gen. dat./plur.nom.': ['sg', 'gen', 'dat', 'plur', 'nom'],
              'part. impf. pl. nom. acc. m. f.': ['part', 'impf', 'pl', 'nom', 'acc', 'm', 'f'],
          }
          for source, expected in cases.items():
              actual = tokenize_morphology_answer(source)
              assert actual == expected, (source, actual, expected)
          assert tokenize_morphology_answer('') == []
          assert tokenize_morphology_answer(None) == []
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add utils.py
          git commit -m "Add reusable morphology answer tokenizer"
          git push

name: Add noun analysis parser

on:
  push:
    branches:
      - exercise-url-presets
    paths:
      - tools/add_noun_analysis_parser.py
      - .github/workflows/add-noun-analysis-parser.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tools/add_noun_analysis_parser.py
      - name: Syntax check
        run: python -m py_compile nouns.py
      - name: Test noun parser
        run: |
          python - <<'PY'
          import ast, re
          text = open('nouns.py').read()
          tree = ast.parse(text)
          wanted = {'segment_noun_analysis_token', 'parse_noun_analysis_answer'}
          nodes = [n for n in tree.body if isinstance(n, (ast.Assign, ast.FunctionDef)) and (
              (isinstance(n, ast.FunctionDef) and n.name in wanted) or
              (isinstance(n, ast.Assign) and any(isinstance(t, ast.Name) and t.id.startswith('NOUN_ANALYSIS_') for t in n.targets))
          )]
          ns = {
              'tokenize_morphology_answer': lambda s: re.findall(r'[^\W\d_]+', s.casefold(), flags=re.UNICODE),
              'noun_options': {'number': {'sg':'singular','pl':'plural'}, 'case': {'nom':'nominative','voc':'vocative','acc':'accusative','gen':'genitive','dat':'dative','abl':'ablative'}},
          }
          exec(compile(ast.Module(body=nodes, type_ignores=[]), '<parser>', 'exec'), ns)
          parse = ns['parse_noun_analysis_answer']

          cases = {
              'sg.gen. dat./plur.nom.': (['sg','gen','dat','pl','nom'], {('sg','gen'),('sg','dat'),('pl','nom')}),
              'sgaccplurdat': (['sg','acc','pl','dat'], {('sg','acc'),('pl','dat')}),
              'sgacc, plur. dat.': (['sg','acc','pl','dat'], {('sg','acc'),('pl','dat')}),
              'SINGNOM PLURACC': (['sg','nom','pl','acc'], {('sg','nom'),('pl','acc')}),
              'sg gen gen': (['sg','gen','gen'], {('sg','gen')}),
          }
          for sample, (tokens, analyses) in cases.items():
              result = parse(sample)
              assert result['valid'], (sample, result)
              assert result['tokens'] == tokens, (sample, result)
              assert result['analyses'] == analyses, (sample, result)

          invalid = {
              'gen sg': 'before any number',
              'sg pl dat': 'has no case',
              'sg xyz dat': 'unrecognized token',
              'sgaccxyz': 'unrecognized token',
              'sg': 'has no case',
          }
          for sample, fragment in invalid.items():
              result = parse(sample)
              assert not result['valid'], (sample, result)
              assert fragment in result['error'], (sample, result)
          print('noun parser tests passed')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nouns.py
          git commit -m "Add noun recognition answer parser"
          git push

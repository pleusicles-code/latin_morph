name: Fix semideponent tense scope

on:
  push:
    branches: [exercise-url-presets]
    paths:
      - '.github/workflows/fix-semideponent-tense-scope.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - run: python scripts/fix_semideponent_tense_scope.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verbs.py
          git commit -m "Fix semideponent tense filtering scope"
          git push origin exercise-url-presets

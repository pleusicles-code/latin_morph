name: Slash only in first feedback row

on:
  push:
    branches: [exercise-url-presets]
    paths:
      - '.github/workflows/slash-first-row-only.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - run: python scripts/slash_first_row_only.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verbs.py
          git commit -m "Show analysis slash only in answer row"
          git push origin exercise-url-presets

name: Add noun exercise mode UI

on:
  push:
    branches:
      - exercise-url-presets
    paths:
      - tools/add_noun_exercise_mode_ui.py
      - .github/workflows/add-noun-exercise-mode-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tools/add_noun_exercise_mode_ui.py
      - name: Syntax check
        run: python -m py_compile nouns.py
      - name: Verify settings hooks
        run: |
          python - <<'PY'
          text = open('nouns.py').read()
          required = [
              '"exercise_type": choice_setting("inflect", ["inflect", "recognize"])',
              '"Print macrons?"',
              '"Indicate multiple correct answers?"',
              '"Expect all correct answers?"',
              '"Inflect words"',
              '"Recognize inflected forms"',
              '"exercise_type": exercise_type',
          ]
          for item in required:
              assert item in text, item
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nouns.py
          git commit -m "Add noun inflect and recognize mode settings"
          git push

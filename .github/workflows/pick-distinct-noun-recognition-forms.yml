name: Pick distinct noun recognition forms

on:
  push:
    branches:
      - exercise-url-presets
    paths:
      - tools/pick_distinct_noun_recognition_forms.py
      - .github/workflows/pick-distinct-noun-recognition-forms.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tools/pick_distinct_noun_recognition_forms.py
      - name: Syntax check
        run: python -m py_compile nouns.py
      - name: Verify recognition form selection
        run: |
          python - <<'PY'
          text = open('nouns.py').read()
          required = [
              'def recognition_gen_question():',
              'form_analyses.setdefault(displayed, set()).add((possible_case, possible_number))',
              'displayed_form = random.choice(list(form_analyses))',
              'st.session_state.nouns_recognition_displayed_form = displayed_form',
              'args=(st.session_state.gen_func,)',
          ]
          for item in required:
              assert item in text, item
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nouns.py
          git commit -m "Pick noun recognition questions from distinct forms"
          git push

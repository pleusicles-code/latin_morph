name: Enable verb recognition evaluation

on:
  push:
    branches: [exercise-url-presets]
    paths:
      - '.github/workflows/enable-verb-recognition-evaluation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - run: python scripts/enable_verb_recognition_evaluation.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verbs.py
          git commit -m "Enable verb recognition evaluation"
          git push origin exercise-url-presets

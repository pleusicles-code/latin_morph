name: Patch temporary alap1 import validator

on:
  push:
    branches: [exercise-url-presets]
    paths:
      - '.github/workflows/_temp_patch_import_validator.yml'

permissions:
  contents: write

jobs:
  patch-validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - name: Patch validator and clean self
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/_temp_import_alap1.yml')
          text = path.read_text(encoding='utf-8')
          old = "          from vocab import import_nouns, import_adjectives, import_verbs\n"
          new = (
              "          import sys, types\n"
              "          sys.modules['streamlit'] = types.SimpleNamespace()\n"
              "          from vocab import import_nouns, import_adjectives, import_verbs\n"
          )
          if old not in text:
              raise RuntimeError('Validation import line not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/_temp_patch_import_validator.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix alap1 import validation environment'
          git push origin HEAD:exercise-url-presets

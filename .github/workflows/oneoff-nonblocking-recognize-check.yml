name: One-off nonblocking recognition check

on:
  push:
    branches: [optional-supabase]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run nonblocking recognition check patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optional-supabase
      - name: Patch recognize_pos.py
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('recognize_pos.py')
          text = p.read_text()

          old = 'def check_recognition_answer(answer_key):\n    answer = st.session_state.get(answer_key)\n    if not answer or st.session_state.answer_checked:\n        return\n'
          new = 'def check_recognition_answer(answer_key):\n    answer = st.session_state.get(answer_key)\n    if not answer or st.session_state.answer_checked:\n        return\n\n    st.session_state.pop("recognize_pos_pending_answer_key", None)\n    st.session_state.pop("recognize_pos_check_after", None)\n'
          if text.count(old) != 1:
              raise SystemExit(f'check block count: {text.count(old)}')
          text = text.replace(old, new, 1)

          old = 'def choose_recognition_answer(answer_key):\n    # Keep the explicit button available, but automatically run the same check\n    # one second after the learner selects a radio option.\n    time.sleep(1)\n    check_recognition_answer(answer_key)\n'
          new = 'def choose_recognition_answer(answer_key):\n    # Schedule the same check used by the explicit button without blocking\n    # Streamlit for the one-second delay.\n    if not st.session_state.answer_checked:\n        st.session_state.recognize_pos_pending_answer_key = answer_key\n        st.session_state.recognize_pos_check_after = time.monotonic() + 1.0\n'
          if text.count(old) != 1:
              raise SystemExit(f'choose block count: {text.count(old)}')
          text = text.replace(old, new, 1)

          marker = '    with feedback_col:\n        st.markdown(st.session_state.answer_display_message)\n\nnew_question_col, results_col, score_col = st.columns(3)\n'
          replacement = '    with feedback_col:\n        st.markdown(st.session_state.answer_display_message)\n\npending_answer_key = st.session_state.get("recognize_pos_pending_answer_key")\ncheck_after = st.session_state.get("recognize_pos_check_after")\nrecognition_timer_interval = 0.2 if pending_answer_key and not st.session_state.answer_checked else None\n\n@st.fragment(run_every=recognition_timer_interval)\ndef recognition_check_timer():\n    pending_key = st.session_state.get("recognize_pos_pending_answer_key")\n    pending_time = st.session_state.get("recognize_pos_check_after")\n    if pending_key and pending_time and not st.session_state.answer_checked and time.monotonic() >= pending_time:\n        check_recognition_answer(pending_key)\n        st.rerun()\n\nrecognition_check_timer()\n\nnew_question_col, results_col, score_col = st.columns(3)\n'
          if text.count(marker) != 1:
              raise SystemExit(f'timer insertion marker count: {text.count(marker)}')
          text = text.replace(marker, replacement, 1)

          p.write_text(text)
          PY
      - name: Syntax check
        run: python -m py_compile recognize_pos.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recognize_pos.py
          git commit -m "Make recognition auto-check nonblocking"
          git push origin optional-supabase

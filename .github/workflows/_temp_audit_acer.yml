name: Temporary audit acer diagnostic
on:
  push:
    branches: [exercise-url-presets]
    paths: ['.github/workflows/_temp_audit_acer.yml']
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - name: Inspect acer data and diagnostic builder
        run: |
          python - <<'PY'
          import sys, types
          st = types.ModuleType('streamlit')
          st.cache_data = lambda f: f
          sys.modules['streamlit'] = st
          import vocab
          adjs = vocab.import_adjectives()
          for k,v in adjs.items():
              if 'cer' in k or 'ācer' in k:
                  print('ENTRY', repr(k), repr(v))
          from pathlib import Path
          text = Path('inflection_tables.py').read_text(encoding='utf-8')
          a = text.index('def adj_form')
          b = text.index('\nSUM =', a)
          print(text[a:b])
          PY

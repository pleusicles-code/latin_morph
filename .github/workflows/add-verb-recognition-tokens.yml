name: Add verb recognition tokens

on:
  push:
    branches: [exercise-url-presets]
    paths:
      - '.github/workflows/add-verb-recognition-tokens.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - run: python scripts/add_verb_recognition_tokens.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add utils.py verbs.py
          git commit -m "Add verb recognition token dictionary"
          git push origin exercise-url-presets
# rerun after test fix

name: Implement noun partial credit

on:
  push:
    branches:
      - exercise-url-presets
    paths:
      - tools/implement_noun_partial_credit.py
      - .github/workflows/implement-noun-partial-credit.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tools/implement_noun_partial_credit.py
      - name: Syntax check
        run: python -m py_compile nouns.py utils.py
      - name: Verify noun evaluation and scoring
        run: |
          python - <<'PY'
          import ast

          nouns_text = open('nouns.py').read()
          utils_text = open('utils.py').read()

          assert '"Award partial credit?"' in nouns_text
          assert 'partially correct answers receive half credit' in nouns_text
          assert 'expect_all_answers' not in nouns_text
          assert 'award_partial_credit' in nouns_text
          assert 'st.session_state.answer_credit_override = (' in nouns_text
          assert '0.5' in nouns_text
          assert 'if user_analyses == possible_analyses:' in nouns_text
          assert 'if correct_supplied:' in nouns_text
          assert 'Take note, however' not in nouns_text
          assert 'credit_override = st.session_state.pop("answer_credit_override", None)' in utils_text
          assert 'answer_credit if credit_override is not None else correct_flag' in utils_text

          tree = ast.parse(nouns_text)
          node = next(n for n in tree.body if isinstance(n, ast.FunctionDef) and n.name == 'evaluate_noun_recognition_answer')
          ns = {}
          exec(compile(ast.Module(body=[node], type_ignores=[]), '<eval>', 'exec'), ns)
          evaluate = ns['evaluate_noun_recognition_answer']

          target = {('sg','nom'), ('sg','gen'), ('pl','nom')}
          assert evaluate(target, target) == 'correct'
          assert evaluate({('sg','nom')}, target) == 'partial'
          assert evaluate({('sg','nom'), ('sg','acc')}, target) == 'partial'
          assert evaluate({('sg','acc')}, target) == 'incorrect'
          assert evaluate({('sg','nom')}, {('sg','nom')}) == 'correct'
          assert evaluate({('sg','nom'), ('sg','acc')}, {('sg','nom')}) == 'partial'
          print('noun partial-credit tests passed')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nouns.py utils.py
          git commit -m "Add noun partial-credit scoring"
          git push

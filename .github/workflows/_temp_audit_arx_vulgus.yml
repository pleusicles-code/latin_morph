name: Temporary audit arx vulgus
on:
  push:
    branches: [exercise-url-presets]
    paths: ['.github/workflows/_temp_audit_arx_vulgus.yml']
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - name: Audit data and noun engine
        run: |
          python - <<'PY'
          import sys, types
          st=types.ModuleType('streamlit'); st.cache_data=lambda f:f; st.set_page_config=lambda *a,**k:None
          sys.modules['streamlit']=st
          import vocab
          nouns=vocab.filter_vocab_by_repo(vocab.import_nouns(),'alap2')
          print('ARX',repr(nouns.get('arx')))
          print('VULGUS',repr(nouns.get('vulgus')))
          PY
          grep -n 'def build_noun' nouns.py

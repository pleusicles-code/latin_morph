name: Temporary fix adjective alternative endings
on:
  push:
    branches: [exercise-url-presets]
    paths: ['.github/workflows/_temp_fix_adj_alt_endings.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - name: Fix diagnostic adjective alternative endings
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile
          p = Path('inflection_tables.py')
          text = p.read_text(encoding='utf-8')
          old = '    ending = ADJ_3[number][gender].get(case)\n    if ending is None:\n        return adj_form(word, info, "nom", number, gender)\n    return stem + ending\n'
          new = '    ending = ADJ_3[number][gender].get(case)\n    if ending is None:\n        return adj_form(word, info, "nom", number, gender)\n    if isinstance(ending, (list, tuple)):\n        return [stem + item for item in ending]\n    return stem + ending\n'
          if old not in text:
              raise SystemExit('target adjective ending block not found')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          py_compile.compile('inflection_tables.py', doraise=True)
          assert 'return [stem + item for item in ending]' in text
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inflection_tables.py
          git commit -m 'Handle alternative adjective endings in diagnostics'
          git push origin HEAD:exercise-url-presets

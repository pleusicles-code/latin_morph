name: Apply new exercise URL presets

on:
  push:
    branches:
      - exercise-url-presets
    paths:
      - tools/apply_new_exercise_presets.py
      - .github/workflows/apply-new-exercise-presets.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tools/apply_new_exercise_presets.py
      - name: Syntax check
        run: python -m py_compile exercise_presets.py recognize_pos.py identify_stems.py verbs.py
      - name: Diff check
        run: git diff --check
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recognize_pos.py identify_stems.py
          git commit -m "Add URL presets to new exercises"
          git push

name: Add verb recognition inference

on:
  push:
    branches: [exercise-url-presets]
    paths:
      - '.github/workflows/add-verb-recognition-inference.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - run: python scripts/add_verb_recognition_inference.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verbs.py
          git commit -m "Infer missing verb recognition parameters"
          git push origin exercise-url-presets

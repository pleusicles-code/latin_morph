name: Temporary check diagnostic repos
on:
  push:
    branches: [exercise-url-presets]
    paths: ['.github/workflows/_temp_check_diag_repos.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - name: Check discovered repos
        run: |
          python - <<'PY'
          import sys, types
          st=types.ModuleType('streamlit'); st.cache_data=lambda f:f; sys.modules['streamlit']=st
          import vocab
          sources=[vocab.import_nouns(), vocab.import_adjectives(), vocab.import_verbs(), vocab.import_pronouns()]
          if hasattr(vocab,'import_misc'): sources.append(vocab.import_misc())
          repos=set()
          for vocabulary in sources:
              for data in vocabulary.values():
                  value=data.get('repo')
                  if isinstance(value,(list,tuple,set)): repos.update(value)
                  elif value: repos.add(value)
          print('REPOS', sorted(repos))
          for repo in sorted(repos):
              counts=[len(vocab.filter_vocab_by_repo(v,repo)) for v in sources]
              print(repo, counts)
          PY

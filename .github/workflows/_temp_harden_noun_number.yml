name: Temporary harden noun number restrictions
on:
  push:
    branches: [exercise-url-presets]
    paths: ['.github/workflows/_temp_harden_noun_number.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - name: Patch and validate
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('nouns.py')
          s=p.read_text(encoding='utf-8')
          old='''        noun, case, number = noun_id\n        noun_decl = noun_vocab.get(noun, {}).get("decl")\n'''
          new='''        noun, case, number = noun_id\n        if number not in allowed_numbers_for_noun(noun):\n            return None\n        noun_decl = noun_vocab.get(noun, {}).get("decl")\n'''
          if old not in s:
              raise SystemExit('build_noun marker not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python -m py_compile nouns.py
          python - <<'PY'
          from pathlib import Path
          s=Path('nouns.py').read_text(encoding='utf-8')
          assert 'if number not in allowed_numbers_for_noun(noun):\n            return None' in s
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nouns.py
          git commit -m 'Enforce noun number restrictions in builder'
          git push origin HEAD:exercise-url-presets

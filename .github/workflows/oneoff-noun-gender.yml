name: One-off noun gender migration

on:
  push:
    branches: [optional-supabase]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message == 'Run noun gender migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optional-supabase

      - name: Migrate noun gender metadata into vocab.py
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          genders = {
              "puella":"f","hōra":"f","agricola":"m","mēnsa":"f","poena":"f","silva":"f","umbra":"f","aqua":"f","causa":"f","anima":"f","pecūnia":"f","stēlla":"f","fēmina":"f","fīlia":"f","dea":"f",
              "servus":"m","equus":"m","fīlius":"m","lupus":"m","animus":"m","annus":"m","gladius":"m","dolus":"m","colōnus":"m","dominus":"m","nātus":"m","amīcus":"m","puer":"m","vir":"m","ager":"m","liber":"m","magister":"m","culter":"m","templum":"n","verbum":"n","iugum":"n","beneficium":"n","signum":"n","bellum":"n","regnum":"n","saxum":"n","somnium":"n","dōnum":"n",
              "leo":"m","mīles":"m","sōl":"m","vōx":"f","rēx":"m","flōs":"m","fūr":"m/f","rūmor":"m","homō":"m/f","servitūs":"f","cīvis":"m/f","nāvis":"f","urbs":"f","mōns":"m","aedes":"f","ignis":"m","nox":"f","turris":"f","nōmen":"n","carmen":"n","genus":"n","lītus":"n","onus":"n","sīdus":"n","caput":"n","animal":"n","mare":"n","rēte":"n","exemplar":"n",
              "manus":"f","senātus":"m","cāsus":"m","ictus":"m","gradus":"m","exercitus":"m","vultus":"m","impetus":"m","currus":"m","sinus":"m","metus":"m","portus":"m","frūctus":"m","cornū":"n","genū":"n",
              "rēs":"f","diēs":"m/f","faciēs":"f","fidēs":"f","spēs":"f","aciēs":"f","speciēs":"f",
              "deus":"m","vīs":"f","bōs":"m/f",
          }

          p = Path("vocab.py")
          text = p.read_text()
          text = text.replace('        "aedis": {', '        "aedes": {')

          start = text.index("def import_nouns():")
          end = text.index("#@st.cache_data\ndef import_pronouns():", start)
          before, block, after = text[:start], text[start:end], text[end:]

          for noun, gender in genders.items():
              pattern = rf'(^        "{re.escape(noun)}": \{{)'
              block, n = re.subn(pattern, rf'\1"gender": "{gender}", ', block, count=1, flags=re.MULTILINE)
              if n != 1:
                  raise RuntimeError(f"Expected exactly one noun entry for {noun!r}, found {n}")

          validation = '''\n    missing_gender = [noun for noun, data in noun_vocab.items() if not data.get("gender")]\n    if missing_gender:\n        raise ValueError(f"Noun entries missing gender metadata: {missing_gender}")\n'''
          block = block.replace("\n    return noun_vocab\n", validation + "\n    return noun_vocab\n", 1)
          p.write_text(before + block + after)

          p = Path("nouns.py")
          text = p.read_text()
          text = text.replace("from noun_metadata import attach_noun_genders\n", "")
          text = text.replace("noun_vocab = attach_noun_genders(import_nouns())", "noun_vocab = import_nouns()")
          p.write_text(text)

          Path("noun_metadata.py").unlink()
          PY

      - name: Syntax check
        run: python -m py_compile vocab.py nouns.py

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vocab.py nouns.py noun_metadata.py
          git commit -m "Move noun gender metadata into main vocabulary"
          git push origin optional-supabase

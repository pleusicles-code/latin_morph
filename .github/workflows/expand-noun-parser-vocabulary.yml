name: Expand noun parser vocabulary

on:
  push:
    branches:
      - exercise-url-presets
    paths:
      - tools/expand_noun_parser_vocabulary.py
      - .github/workflows/expand-noun-parser-vocabulary.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tools/expand_noun_parser_vocabulary.py
      - name: Syntax check
        run: python -m py_compile nouns.py
      - name: Test expanded vocabulary
        run: |
          python - <<'PY'
          import ast, re
          text = open('nouns.py').read()
          tree = ast.parse(text)
          wanted = {'segment_noun_analysis_token', 'parse_noun_analysis_answer'}
          nodes = [
              n for n in tree.body
              if (isinstance(n, ast.Assign) and any(isinstance(t, ast.Name) and t.id.startswith('NOUN_ANALYSIS_') for t in n.targets))
              or (isinstance(n, ast.FunctionDef) and n.name in wanted)
          ]
          ns = {
              'tokenize_morphology_answer': lambda s: re.findall(r'[^\W\d_]+', s.casefold(), flags=re.UNICODE),
              'noun_options': {'number': {'sg':'singular','pl':'plural'}, 'case': {'nom':'nominative','voc':'vocative','acc':'accusative','gen':'genitive','dat':'dative','abl':'ablative'}},
          }
          exec(compile(ast.Module(body=nodes, type_ignores=[]), '<parser>', 'exec'), ns)
          parse = ns['parse_noun_analysis_answer']
          samples = {
              'singular nominative': {('sg','nom')},
              'singularis nominativus': {('sg','nom')},
              'plural accusative': {('pl','acc')},
              'pluralis accusativus': {('pl','acc')},
              'singulargenitivepluraldative': {('sg','gen'),('pl','dat')},
              'singularisgenitivuspluralisablativus': {('sg','gen'),('pl','abl')},
          }
          for sample, analyses in samples.items():
              result = parse(sample)
              assert result['valid'], (sample, result)
              assert result['analyses'] == analyses, (sample, result)
          print('expanded noun parser vocabulary tests passed')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nouns.py
          git commit -m "Expand noun recognition parser vocabulary"
          git push

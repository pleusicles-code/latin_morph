name: Temporary enable alap2 in exercises
on:
  push:
    branches: [exercise-url-presets]
    paths: ['.github/workflows/_temp_enable_alap2_exercises.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exercise-url-presets
      - name: Patch and validate
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          vp = Path('vocab.py')
          s = vp.read_text(encoding='utf-8')
          marker = '''def filter_vocab_by_repo(vocab, repo_name):\n    return {\n        key: value for key, value in vocab.items()\n        if repo_name in _repo_values(value.get("repo"))\n    }\n'''
          addition = marker + '''\n\ndef filter_vocab_by_repos(vocab, repo_names):\n    repo_names = set(repo_names)\n    return {\n        key: value for key, value in vocab.items()\n        if repo_names.intersection(_repo_values(value.get("repo")))\n    }\n'''
          if 'def filter_vocab_by_repos(' not in s:
              if marker not in s:
                  raise SystemExit('filter_vocab_by_repo marker not found')
              s = s.replace(marker, addition, 1)
              vp.write_text(s, encoding='utf-8')

          targets = [
              'nouns.py','adjectives.py','verbs.py','verbal_adj.py',
              'recognize_declension.py','recognize_pos.py','identify_stems.py'
          ]
          changed = []
          for name in targets:
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              original = text
              text = text.replace('filter_vocab_by_repo', 'filter_vocab_by_repos')
              text = re.sub(
                  r'filter_vocab_by_repos\((import_[A-Za-z_]+\(\)),\s*["\']alap1["\']\)',
                  r'filter_vocab_by_repos(\1, ("alap1", "alap2"))',
                  text,
              )
              if text == original:
                  raise SystemExit(f'no alap1 repo filter changed in {name}')
              p.write_text(text, encoding='utf-8')
              changed.append(name)
          print('changed:', ', '.join(changed))
          PY

          python -m py_compile vocab.py nouns.py adjectives.py verbs.py verbal_adj.py recognize_declension.py recognize_pos.py identify_stems.py inflection_tables.py

          python - <<'PY'
          from pathlib import Path
          targets = ['nouns.py','adjectives.py','verbs.py','verbal_adj.py','recognize_declension.py','recognize_pos.py','identify_stems.py']
          for name in targets:
              s=Path(name).read_text(encoding='utf-8')
              assert 'filter_vocab_by_repos' in s, name
              assert '("alap1", "alap2")' in s, name
              assert 'filter_vocab_by_repo(' not in s, name
          v=Path('vocab.py').read_text(encoding='utf-8')
          assert 'def filter_vocab_by_repos(' in v
          PY

          echo 'Remaining explicit alap1-only repo filters in Python files:'
          grep -R -n --include='*.py' 'filter_vocab_by_repo(.*"alap1"' . || true

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vocab.py nouns.py adjectives.py verbs.py verbal_adj.py recognize_declension.py recognize_pos.py identify_stems.py
          git commit -m 'Enable alap1 and alap2 vocabulary in exercises'
          git push origin HEAD:exercise-url-presets
